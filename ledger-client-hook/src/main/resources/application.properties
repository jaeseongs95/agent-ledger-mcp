# The client hook is a short command line process that a host starts for every tool call: no web server and no port, and
# nothing of Boot on the standard output. The host reads all of stdout as the answer of the hook, so there is no banner and
# no startup line (the log goes to the standard error, see logback-spring.xml).
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false
# The JSON of the host: the JsonMapper that Boot configures (JacksonAutoConfiguration) with what the hook needs beyond its
# defaults (see JsonCodec): nesting deeper than 256 levels is malformed input (the answer wraps the input one or two levels
# deeper, hence 264 when writing); decimals are BigDecimal and keep their trailing zeros, never a double; text after the first
# JSON value is an error, as with JSON.parse; the answer {} is a record without components. Unknown fields of the host events
# are ignored (a Boot default).
spring.jackson.factory.constraints.read.max-nesting-depth=256
spring.jackson.factory.constraints.write.max-nesting-depth=264
spring.jackson.deserialization.use-big-decimal-for-floats=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.datatype.json-node.use-big-decimal-for-floats=true
spring.jackson.datatype.json-node.strip-trailing-bigdecimal-zeroes=false
spring.jackson.serialization.fail-on-empty-beans=false
# The key store (KeyStoreProperties): the key folder is ledger.hook.key-dir, which the environment variable LEDGER_HOOK_KEY_DIR
# sets (relaxed binding; it must be an absolute path); without it the key folder is <ledger.hook.user-home>/.pg-ledger-mcp/session-keys.
# The home folder and the account that must own the key files are the ones of the process.
ledger.hook.user-home=${user.home:}
ledger.hook.user-name=${user.name:}
