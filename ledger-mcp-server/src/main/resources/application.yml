spring:
  application:
    name: ledger-mcp-server
  threads:
    virtual:
      enabled: true
  messages:
    # the bundles of the domain (error codes, validation reasons) and of this server (tool and argument texts)
    basename: messages/ledger-errors,messages/ledger-reasons,messages/mcp
    fallback-to-system-locale: false
    encoding: UTF-8
  ai:
    mcp:
      server:
        name: ledger
        version: 5.0.0
        type: SYNC
        protocol: STREAMABLE
        instructions: >-
          Use ledger_search for unknown IDs and ledger_get for known IDs. Select needed fields and reuse returned row versions.
          When your client reads structuredContent, set structured_only=true. Use ledger_batch for author changes and
          ledger_review for independent decisions. Inspect attachment status when resuming a transfer.
        streamable-http:
          mcp-endpoint: /mcp
        # The catalog (ToolCatalog) is the only one that registers the tools, with the definitions built for this server. With the
        # scanner on, Spring AI registers the annotated tools first and the catalog replaces each of them, which the SDK logs as a WARN.
        annotation-scanner:
          enabled: false
server:
  # The server listens on 127.0.0.1 only: LoopbackOnly sets the address in code, so there is no setting for it. Reaching it from
  # another machine is a reverse proxy of the operator on this host.
  port: 8765
  compression:
    enabled: true
    # Compress JSON/plain payloads while explicitly excluding text/event-stream so SSE frames flush immediately.
    mime-types: application/json,text/plain
    min-response-size: 1KB
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: healthz
  endpoint:
    health:
      show-details: never
