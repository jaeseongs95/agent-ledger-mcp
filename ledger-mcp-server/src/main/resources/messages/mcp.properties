# English texts that a model reads: the descriptions of the tools and of their arguments, and the catalog texts.
# A description in a tool declaration is one of these keys; the tool catalog resolves it.

catalog.empty=No active {0} codes exist yet. Add one with: ledger-cli code-set {0} CODE NAME

# ---------------------------------------------------------------- write tools
tool.ledger_save=Create (expected_version = 0 or absent) or edit (expected_version = current version) a defect, task or condition. fields is an object with the keys of the kind. Defect: project_id (new only), title, category, severity (required: a defect that still holds the retired UNRATED must be rated in the same write), behavior, root_cause, owner_actor_id. Task: project_id, title, purpose, success_condition, owner_actor_id, origin_ref, origin_quote. Condition: project_id, release, goal_label, code, condition_text. A key written with null or an empty text clears an optional field; a key left out is not touched. A new defect without id gets the next <PROJECT_CODE>-D-<n> id and a new task without id the next <PROJECT_CODE>-T-<n> id. State changes use ledger_transition. Needs scope defect (defect) or task (task, condition).
tool.ledger_transition=Change the state of a defect, task or condition (one history row). Defect: OPEN, SOURCE_FIXED (needs a recorded fix), NOT_DEFECT and DISPUTED (need evidence_uri), MERGED (needs merged_into). Task: PLANNED, ACTIVE, BLOCKED, REPORTED_DONE (needs evidence_uri), CANCELLED. VERIFIED, MET and NOT_MET, and any move out of them, go through ledger_review. Needs scope defect or task.
tool.ledger_record_fix=Record a fix commit for a defect, or update the CI result of an already recorded fix. Recording a new fix commit makes the fixing session the owner of the defect (fixed_by) while created_by stays. An OPEN defect moves to SOURCE_FIXED in the same transaction unless mark_source_fixed is false. Needs scope fix.
tool.ledger_record_case=Add one observed case (symptom, log, user report) under a defect. One defect is one root cause; its cases are listed by ledger_defect together with the cases of the defects merged into it. A MERGED defect is refused: the error names the defect it was merged into, record the case there. Needs scope defect.
tool.ledger_link=Add a link, or with remove = true remove it. defect_task: a = defect, b = task. A relation kind: a and b are defects. A kind that the list of kinds marks as directed (as shipped: caused_by = a is caused by b, blocks = a blocks b) keeps a as the subject and b as the object: (a, b) and (b, a) are two different relations, and remove = true has to give them in the order they were linked. Every other kind has no direction: it is one relation in either order (regression_of: b is the later recurrence of a, by the order of the ids). condition_task and condition_defect: a = condition. Needs scope defect (defect links) or task (condition links).
tool.ledger_correct=Mark a history row as wrong with a CORRECT row (history is never edited). Corrections of verification rows go through ledger_review_correct.
tool.ledger_batch=Run up to 200 write operations in one transaction: all of them commit or none does, and an error names the failing operation. ops is an array of objects {op: save | transition | record_fix | record_case | link | correct, ...} with the arguments of the single tool. The batch has one required operationKey; an operation carries no key of its own, the key of each is derived from the operationKey of the batch and the position, so sending the same batch again with the same operationKey returns the stored results. Grants, the channel rules (no verification here) and all checks are those of the single tools.
tool.ledger_review=Reviewer transition. Defect SOURCE_FIXED to VERIFIED needs evidence_uri and at least one recorded fix from another session; CI is optional metadata. The developer provides the source SHA, the original failure reproduction and the direct execution steps; the reviewer runs the actual program. Send verification results or rework requests to the session that fixed the defect (fixed_by of ledger_defect), not to created_by. Task REPORTED_DONE to VERIFIED needs evidence_uri and a session other than the owner and the completion reporter. Condition to MET or NOT_MET needs evidence_uri. Also reopens VERIFIED rows (evidence_uri required). Needs scope verify.
tool.ledger_review_correct=Mark a verification history row as wrong with a CORRECT row. Needs scope verify.
tool.ledger_whoami=Show whether an author id is well formed and which live grants (project, scope) it holds. Read only.

# ---------------------------------------------------------------- attachment tools
tool.artifact_begin=Start the upload of a file that a record can point to (evidence, for example a review report). Files get into the ledger through the five artifact tools and no other way, and the server reads no path of the caller's computer. operationKey is required and makes begin repeatable: the same operationKey with the same fileName, size and sha256 returns the same uploadId, other content under that key is ARTIFACT_OPERATION_CONFLICT; the server never makes a key up. Then send the file with artifact-chunk in chunks of at most 262144 bytes (sequence 0, 1, 2, ...) and close it with artifact-finish. The answer has uploadId, maxChunkBytes (262144) and expiresAt; the expiry is counted again from every chunk. The largest file is 64 MiB unless the settings of the server say otherwise; a begin over the file size limit, over a budget or over the number of open uploads of the author is refused with ARTIFACT_LIMIT and nothing is cut or deleted. purpose is optional: only evidence is supported (and is the default), another value is ARTIFACT_UNSUPPORTED_PURPOSE. Needs at least one live grant of the author, any project.
tool.artifact_chunk=Send the next chunk of an upload. sequence starts at 0 and must be the next number; data is the chunk in base64 (at most 262144 bytes before the encoding, 349528 characters); chunkSha256 is the SHA-256 of those bytes (64 lowercase hex characters), and a chunk that does not match it is CHUNK_HASH_MISMATCH. The answer has sequence and received (the bytes the upload holds now). A repeated chunk is answered with the current state: sending the last applied chunk again with the same content changes nothing and returns the same answer, which is the way to go on after a lost answer. This tool takes no operationKey, the one exception to the rule that every write tool does: the upload starts with the operationKey of artifact-begin, and a chunk is repeatable by its uploadId, sequence and chunkSha256 (the same uploadId, sequence and content again is idempotent, other content under it is a conflict). An earlier number, a number out of order, or other content under the number of the last applied chunk is ARTIFACT_CHUNK_CONFLICT; a chunk that goes past the declared size is ARTIFACT_HASH_MISMATCH; a chunk for an upload that expired is ARTIFACT_EXPIRED (begin a new upload); an unknown upload, or one of another author, is ARTIFACT_NOT_FOUND. ARTIFACT_BUSY means that another request is appending to this upload right now: send the same chunk again later (the server does not wait and does not retry). Needs at least one live grant of the author.
tool.artifact_finish=Close an upload after its last chunk. The server checks that the received bytes are the declared size, decrypts the stored file and recomputes its SHA-256, compares it with the declared sha256, and keeps the file as an attachment; the answer has attachmentId (the id of the upload), size and sha256. Calling finish again for a finished upload returns the same attachment. This tool takes no operationKey, the one exception to the rule that every write tool does: the upload started with the operationKey of artifact-begin, and finish is repeatable by its uploadId (the same uploadId always returns the same attachmentId). Errors: ARTIFACT_INCOMPLETE means that the last chunk is stored but not recorded yet, or that bytes are missing: send the last chunk again (same sequence and content) or the missing chunks, then finish; ARTIFACT_HASH_MISMATCH means that the size or the SHA-256 of the received bytes is not the declared one: the bytes are kept, nothing is deleted, and the upload expires like any other open upload; ARTIFACT_EXPIRED means that the upload expired; ARTIFACT_BUSY means that a chunk is being appended: finish again later. Needs at least one live grant of the author.
tool.artifact_status=Show an upload (state STAGING or COMPLETED) or a kept attachment: id, state, fileName, mediaType, size, sha256, expiresAt (null for an attachment), received (the bytes held) and sequence (the number of the next chunk; null for an attachment). Give exactly one of uploadId and attachmentId: both or neither is VALIDATION_FAILED. An upload is shown to its author only. The answer has no path and no storage key. Use it to see where an upload stands after an unclear result. Needs at least one live grant of the author.
tool.artifact_read=Read one page of a kept attachment: offsetBytes (0 up to the size of the file) and maxBytes (1 to 262144). The answer has attachmentId, offsetBytes, totalBytes, size (the bytes of this page), data (the page in base64), mediaType, fileName and text (the page as text when the media type is text/* or JSON and the bytes are valid UTF-8, otherwise null: a page can end inside a multi-byte character, then read again with another offset or decode data). Every page is decrypted and checked; ARTIFACT_CORRUPTED means that the stored file does not pass its check; an unknown attachment is ARTIFACT_NOT_FOUND. Any author with a live grant may read any attachment. Needs at least one live grant of the author.

# ---------------------------------------------------------------- read tools
tool.ledger_get=The state and version of many ids at once (defects, tasks and conditions may be mixed): the check after a write and the way to get an expected_version. An id that is both a defect id and a task id gives both items; unknown ids are listed in not_found.
tool.ledger_defect=One defect with its fixes, tasks, conditions, cases (also those of defects merged into it), relations (kind, other defect and end: the end of the relation this defect is, a or b; for a directed kind a is the subject, for example the defect that is caused), last change, recent changes, fixed_by and owner.
tool.ledger_task=One task with title, purpose, success condition, origin, owner, state, version, the session that reported it done (completed_by), its defects and conditions.
tool.ledger_history=The history, the receipt of every write, ascending by id: by id list, id range, entity, project, operation, author and time range. include_before adds before_data, the full row as it was before the change, where there is one.
tool.ledger_search=Find defects, tasks and conditions by keywords (title, purpose, behavior, root cause or condition text, case-insensitive, % _ and backslash are literal), newest first. match = ANY (default) or ALL.
tool.ledger_defects=The defects of a project, newest first, optionally filtered by status, severity, category, attention kind and owner.
tool.ledger_tasks=The tasks of a project, newest first, optionally filtered by state, owner and attention kind.
tool.ledger_conditions=The release conditions of a project, optionally filtered by state and release.
tool.ledger_attention=The defects and tasks that need a look, five kinds: OPEN_WITH_FIX, FIXED_WITHOUT_COMMIT, OPEN_NO_OWNER, TASK_UNKNOWN, DONE_NOT_VERIFIED.
tool.ledger_stats=Counts per state: defects by status and severity, tasks by state, conditions by state, of one project or of all. bucket = day adds the new defects and tasks per UTC day.
tool.ledger_projects=The projects with id, code and title.
tool.ledger_codes=The common codes (defect category, defect severity, relation kind) with their texts; direction is GIVEN for a relation kind that keeps the order of a and b (directed), otherwise CANONICAL. Retired codes are listed only with include_inactive.

# ---------------------------------------------------------------- arguments
param.host_attestation=Filled by the host hook with the signed attestation of the session (signed for this tool, this operationKey, the exact arguments of the call and the current time); do not supply manually. Without it every write is refused with HOST_ATTESTATION_REQUIRED, an unsigned or wrongly signed one with an ATTESTATION_* error. The artifact tools and ledger_whoami carry no operationKey in the attestation: it is signed for the tool and the arguments only.
param.artifact_operation_key=Required. Your own key for this upload, 1..128 characters, for example a UUID: the same key with the same fileName, size and sha256 gives the same uploadId again, so a begin whose answer was lost can be sent again.
param.artifact_file_name=Name of the file, 1..255 characters, without a path separator or a control character.
param.artifact_media_type=Media type of the file, type/subtype, for example text/markdown or application/pdf.
param.artifact_size=Size of the whole file in bytes; the received bytes must add up to it.
param.artifact_sha256=SHA-256 of the whole file (64 lowercase hex characters); finish compares it with the hash the server computes.
param.artifact_purpose=Optional. Only evidence is supported and is the default.
param.artifact_upload_id=The uploadId that artifact-begin answered.
param.artifact_sequence=Number of the chunk: 0 for the first, then 1, 2, ...; the next number, or the number of the last applied chunk to repeat it.
param.artifact_data=The chunk in base64: at most 262144 bytes before the encoding (349528 characters).
param.artifact_chunk_sha256=SHA-256 of the bytes of this chunk (64 lowercase hex characters).
param.artifact_status_upload_id=Id of an upload of yours. Give exactly one of uploadId and attachmentId.
param.artifact_status_attachment_id=Id of a kept attachment. Give exactly one of uploadId and attachmentId.
param.artifact_attachment_id=Id of the attachment (the attachmentId that artifact-finish answered).
param.artifact_offset_bytes=Where the page starts, in bytes: 0 up to the size of the file.
param.artifact_max_bytes=The most bytes the page may hold, 1..262144.
param.operation_key=Required. Your own key for this write, 1..128 characters, for example a UUID: the same key with the same arguments returns the stored answer and writes once, so a write whose answer was lost can be sent again; the same key with other arguments is OPERATION_CONFLICT. The server never makes a key up: a missing or empty key is VALIDATION_FAILED.
param.batch_operation_key=Required. Your own key for the whole batch, 1..128 characters, for example a UUID: the same key with the same operations returns the stored results and writes once; the same key with other operations is OPERATION_CONFLICT. The operations carry no key of their own. A missing or empty key is VALIDATION_FAILED.
param.reason=Why, 10..1000 characters.
param.case_reason=Why it is recorded, 10..1000 characters.
param.correct_reason=What was wrong, 10..1000 characters.
param.entity=What to save or change: defect, task or condition.
param.review_entity=What to review: defect, task or condition.
param.id=Row id.
param.save_id=Row id; required to edit and for a new condition; omit it for a new defect or task to get the next id.
param.expected_version=Current version of the row (optimistic lock).
param.save_expected_version=0 or absent to create, otherwise the current version (optimistic lock).
param.fields=The fields to set, as an object. The valid keys depend on the entity.
param.transition_to=New state for this entity (verification uses ledger_review).
param.review_to=New state: VERIFIED, MET, NOT_MET, or the state a VERIFIED, MET or NOT_MET row goes back to.
param.evidence_uri=Link to the evidence (CI run, commit, log).
param.review_evidence_uri=Link to the run that shows the result.
param.evidence_sha256=SHA-256 (64 lowercase hex characters) of the evidence file, if any.
param.merged_into=Target defect id for MERGED.
param.defect_id=Defect id.
param.task_id=Task id.
param.repo=Repository, for example owner/name.
param.commit_sha=Full 40-character lowercase commit SHA.
param.branch=Branch of the commit.
param.ci_ref=CI run URL; required with ci_conclusion and to update an existing fix.
param.ci_conclusion=Optional CI result metadata; not a verification requirement.
param.ci_completed_at=CI completion time, ISO 8601.
param.mark_source_fixed=Move an OPEN defect to SOURCE_FIXED (default true).
param.observation=What was observed, 1..4000 characters.
param.case_evidence=Where it can be checked: request id, file:line, log location, run URL (up to 2000 characters).
param.user_quote=The words of the user, verbatim (up to 2000 characters).
param.observed_at=When it was observed, ISO 8601; omitted means not known.
param.kind=Link kind.
param.link_a=First id. For a directed relation kind it is the subject: the defect that is caused (caused_by) or the one that blocks (blocks).
param.link_b=Second id. For a directed relation kind it is the object: the cause (caused_by) or the defect that is blocked (blocks).
param.remove=Remove the link instead of adding it.
param.history_id=History id to correct.
param.ops=Array of 1..200 operation objects.

param.ids=Ids to look up (1..200), defects, tasks and conditions mixed.
param.project=Project id.
param.max_rows=Rows per page, 1..1000 (default 50). A longer list is cut and the result carries truncated and next_cursor.
param.cursor=The next_cursor of the previous page of the same call with the same filters.
param.history_ids=History ids.
param.id_from=Lowest history id.
param.id_to=Highest history id.
param.history_entity=Kind of row the history entry is about.
param.entity_id=Id of that row.
param.op=Operation of the history entry.
param.history_author_id=Author of the history entry.
param.at_from=Earliest time (UTC, ISO 8601, inclusive).
param.at_to=Latest time (UTC, ISO 8601, inclusive).
param.include_before=Also return before_data (the full row before the change) where there is one.
param.search_kinds=Kinds to search: defect, task, condition (default all).
param.keywords=Keywords, 1..200 characters each.
param.match=ANY: one keyword is enough (default). ALL: every keyword must be found.
param.exclude_status=States to leave out.
param.created_from=Earliest creation time (UTC, ISO 8601, inclusive).
param.created_to=Latest creation time (UTC, ISO 8601, inclusive).
param.defect_status=Defect status.
param.severity=Severity code (also a retired one, such as UNRATED).
param.category=Category code.
param.attention_kind=Attention kind.
param.attention_filter=Only this kind of item.
param.owner=Owner (author id).
param.task_state=Task state.
param.condition_state=Condition state.
param.release=Release name.
param.bucket=day adds the new defects and tasks per UTC day.
param.code_group=Common-code group.
param.include_inactive=Also list retired codes.

# ---------------------------------------------------------------- fields of ledger_save
field.project_id=Project id (when creating).
field.title=Title.
field.category=Defect category.
field.severity=Defect severity.
field.behavior=Defect: what happens.
field.root_cause=Defect: the root cause.
field.owner_actor_id=Owner, an author id; clears the owner when written empty.
field.purpose=Task: purpose.
field.success_condition=Task: how to tell that it is done.
field.origin_ref=Task: where the task comes from.
field.origin_quote=Task: the words of the user it comes from.
field.release=Condition: release name.
field.goal_label=Condition: goal label.
field.code=Condition: code, unique per project and release.
field.condition_text=Condition: the condition.
param.attachment_id=Optional. Id of a kept attachment of yours (the attachmentId that artifact-finish answered), for example the review report; the history row of this record points to it. An id that is not a UUID, or that is not an attachment of yours, fails the whole record and nothing is written.
