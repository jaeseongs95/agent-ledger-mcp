# English texts read by MCP agents: descriptions of all 33 tools, their parameters, and shared catalog texts.
# Every key named on @McpTool, @McpToolParam, or @JsonPropertyDescription is resolved from this bundle.

catalog.empty=No active {0} codes exist yet. Add one with: ledger-cli code-set {0} CODE NAME

# ---------------------------------------------------------------- write tools (13)
tool.ledger_issue_save=Create (expected_version = 0 or omitted) or edit (expected_version = current version) an issue in any domain (production blocker, quality discrepancy, continuity gap, editorial error, operational incident, or technical defect). On create: project_id, title, symptom, and root_cause are required; category and severity must be active codes from ISSUE_CATEGORY and ISSUE_SEVERITY; omitting id allocates the next <PROJECT_CODE>-I-NNNN id, or supply an explicit <PROJECT_CODE>-I-NNNN up to the next project number (ID_NUMBER_AHEAD names the next id). On edit: id and expected_version are required, project_id cannot change (PROJECT_MOVE_FORBIDDEN), at least one field must be supplied, omitted or null fields stay untouched, and an empty string clears an optional field (such as owner_actor_id). A VERIFIED issue cannot be edited (VERIFIED_ENTITY) until an independent reviewer reopens it via ledger_review. State changes use ledger_transition. Requires project scope issue.
tool.ledger_spec_save=Create (expected_version = 0 or omitted) or edit (expected_version = current version) a specification (feature requirement, scene/sequence plan, chapter outline, deliverable blueprint, or acceptance contract). New specifications start in PLANNED status. On create: project_id and title are required; summary, acceptance_criteria, parent_id (parent specification in the same project), priority, owner_actor_id, origin_ref, and origin_quote are optional; omitting id allocates the next <PROJECT_CODE>-S-NNNN id, or supply a <PROJECT_CODE>-S-NNNN or free-text id. On edit: id and expected_version are required, at least one field must be supplied, omitted or null fields stay untouched, and an empty string clears an optional field. A VERIFIED specification cannot be edited (VERIFIED_ENTITY) until reopened via ledger_review. Completion reporting uses ledger_record_deliverable or ledger_transition (COMPLETED), and independent sign-off uses ledger_review (VERIFIED). Requires project scope spec (on both projects when moving project_id).
tool.ledger_task_save=Create (expected_version = 0 or omitted) or edit (expected_version = current version) an actionable work task in any domain. New tasks start in PLANNED state. On create: project_id and title are required; purpose, success_condition, owner_actor_id, origin_ref, and origin_quote are optional; omitting id allocates the next <PROJECT_CODE>-T-NNNN id, or supply a <PROJECT_CODE>-T-NNNN or free-text id. On edit: id and expected_version are required, at least one field must be supplied, omitted or null fields stay untouched, and an empty string clears an optional field. A VERIFIED task cannot be edited (VERIFIED_ENTITY) until reopened via ledger_review. State changes use ledger_transition. Requires project scope task (on both projects when moving project_id).
tool.ledger_criterion_save=Create (expected_version = 0 or omitted) or edit (expected_version = current version) a milestone acceptance criterion (release gate, cut/publication readiness check, or stage exit criterion). New criteria start in UNKNOWN state and always require an explicit id (1..128 characters, ASCII letters/digits/._:-). On create: project_id, id, milestone_name, code (unique within project_id + milestone_name), and criterion_text are required; goal_label is optional. On edit: id and expected_version are required, at least one field must be supplied, omitted or null fields stay untouched, and an empty string clears goal_label. A MET or NOT_MET criterion cannot be edited (VERIFIED_ENTITY) until reopened via ledger_review. Evaluation to MET or NOT_MET uses ledger_review. Requires project scope task (on both projects when moving project_id).
tool.ledger_transition=Advance or change the author-side lifecycle state of an issue, spec, task, or criterion (records one immutable history entry). Issue states: OPEN, RESOLVED (requires at least one recorded deliverable via ledger_record_deliverable), NOT_AN_ISSUE and DISPUTED (require evidence_uri), MERGED (requires merged_into; scope issue is required on the merge target project too). Spec states: DRAFT, PLANNED, ACTIVE, BLOCKED, COMPLETED (requires evidence_uri), CANCELLED. Task states: PLANNED, ACTIVE, BLOCKED, COMPLETED (requires evidence_uri), CANCELLED. Criterion states: UNKNOWN, PLANNED, ACTIVE, COMPLETED (requires evidence_uri). Independent reviewer states (VERIFIED, MET, NOT_MET) and reopening from them are refused here and must use ledger_review. Requires project scope issue (issue), spec (spec), or task (task, criterion).
tool.ledger_record_deliverable=Record a concrete deliverable produced for an issue, spec, or task (code revision, manuscript draft, edited cut, design sheet, dataset, specification revision, or packaged artifact), or update external check metadata on an already recorded deliverable. Recording a new deliverable sets owner_actor_id on the target while preserving created_by. When mark_done is omitted or true: an OPEN issue moves to RESOLVED, and a DRAFT/PLANNED/ACTIVE/BLOCKED spec moves to COMPLETED in the same transaction (set mark_done = false to record intermediate deliverables without advancing state). Refused on VERIFIED targets (VERIFIED_ENTITY) until reopened via ledger_review. Requires project scope deliverable plus the target scope (issue, spec, or task).
tool.ledger_record_case=Record one observed occurrence, reproduction, field note, or source report under an issue. An issue represents one underlying problem; ledger_issue returns all cases recorded directly on it plus those from issues merged into it. Refused on a MERGED issue (names the target issue to record the case on instead). Requires project scope issue.
tool.ledger_link=Create a typed link between two ledger records, or remove an existing link when remove = true. Fixed cross-entity kinds: issue_task (a = issue, b = task), issue_spec (a = issue, b = spec), spec_task (a = spec, b = task), criterion_task (a = criterion, b = task), criterion_issue (a = criterion, b = issue), criterion_spec (a = criterion, b = spec). Issue-to-issue relation kinds come from RELATION_KIND (both a and b are issue ids): a kind marked as directed (as shipped: caused_by = a is caused by b, blocks = a blocks b) keeps a as the subject and b as the object, so (a, b) and (b, a) are two different relations and remove = true must pass them in the linked order; every undirected kind is one relation in either order (regression_of: the higher id is the later recurrence). Requires the corresponding scope on the project(s) of both endpoints.
tool.ledger_correct=Append an immutable CORRECT history entry marking a prior author-channel history entry as erroneous (existing history rows are never mutated or deleted). To correct a reviewer verification entry, use ledger_review_correct.
tool.ledger_batch=Execute 1..200 author-channel write operations atomically in a single transaction: either all operations commit or everything rolls back with details naming op_index and op. Each item in ops selects op in {save, transition, record_deliverable, record_case, link, correct}. The batch takes one required operationKey for the whole batch; individual items carry no operationKey, and per-item receipt keys are deterministically derived from the batch operationKey and index so retrying the identical batch replays the stored results. Verification states are not permitted in a batch; use ledger_review.
tool.ledger_review=Independent reviewer verification and reopening transition for an issue, spec, task, or criterion. Issue RESOLVED to VERIFIED requires evidence_uri, at least one recorded deliverable, and an independent reviewer session that never created the issue, owned it, recorded a case on it, or recorded/amended a deliverable on it (SAME_SESSION). Spec COMPLETED to VERIFIED requires evidence_uri and a reviewer session distinct from its creator, owners, completion reporters, and deliverable authors (SAME_SESSION). Task COMPLETED to VERIFIED requires evidence_uri and a reviewer session distinct from its creator, owners, completion reporters, and deliverable authors (SAME_SESSION). Criterion transition to MET or NOT_MET requires evidence_uri and a reviewer session that did not create or edit the criterion (SAME_SESSION). Automated check results are optional metadata; the reviewer directly inspects and verifies the actual deliverable or work product. Send rework feedback to the session that produced the work (resolved_by of ledger_issue, or completed_by of ledger_spec / ledger_task), not blindly to created_by. Also reopens VERIFIED, MET, or NOT_MET items when given evidence_uri. Requires project scope verify.
tool.ledger_review_correct=Append an immutable CORRECT history entry marking a prior reviewer verification history entry as erroneous. Requires project scope verify.
tool.ledger_whoami=Inspect the resolved caller identity (from the HTTP Bearer session token in standard mode or signed _hostAttestation in attested mode), whether the author identifier format is valid, whether the channel can verify, and all live project grants (project, scope, expires_at). Read-only and idempotent.

# ---------------------------------------------------------------- attachment tools (5)
tool.artifact_begin=Start the upload of a bundle of files that a ledger record can reference (such as verification evidence, inspection logs, reference media, or review bundles). Files enter the ledger through the five artifact_* tools and no other way, and the server never reads local filesystem paths of the caller. operationKey is required and makes begin repeatable: the same operationKey with the same files list returns the same attachmentId and uploadIds, whereas different content under that key fails with ARTIFACT_OPERATION_CONFLICT; the server never makes a key up. files declares 1..64 files in order (seq 0, 1, ...). Upload each file with artifact_chunk in chunks of at most 262144 bytes and seal the bundle with artifact_finish(attachmentId). Returns attachmentId, files ([{seq, uploadId}]), maxChunkBytes (262144), and expiresAt. Maximum single file size defaults to 64 MiB unless configured otherwise; exceeding file count, file size, staging budget, attachment budget, or open bundle limits fails with ARTIFACT_LIMIT without truncating or deleting data. purpose is optional (only evidence is supported and is the default; any other value fails with ARTIFACT_UNSUPPORTED_PURPOSE). Requires at least one live grant on any project.
tool.artifact_chunk=Upload the next chunk of one staged file in a bundle. sequence starts at 0 and advances by 1; data holds base64-encoded bytes (at most 262144 raw bytes, 349528 base64 characters); chunkSha256 is the 64-character lowercase hex SHA-256 of those raw bytes (mismatch fails with CHUNK_HASH_MISMATCH). Returns sequence and received (total raw bytes stored for this file). A repeated chunk is answered with the current state: resending the last applied chunk with identical content is a safe no-op for recovering from lost responses. This tool takes no operationKey, the one exception to the write-tool key rule: the upload began under the operationKey of artifact_begin, and each chunk is repeatable by its uploadId, sequence and chunkSha256. Out-of-order sequences or altered content on the last sequence fail with ARTIFACT_CHUNK_CONFLICT; exceeding declared file size fails with ARTIFACT_HASH_MISMATCH; expired uploads fail with ARTIFACT_EXPIRED; unknown or foreign uploads fail with ARTIFACT_NOT_FOUND; concurrent appends return ARTIFACT_BUSY (send the same chunk again later). Authorized by uploadId capability, with owner isolation enforced whenever caller identity is present.
tool.artifact_finish=Verify and seal a staged attachment bundle after all chunks for every declared file have been uploaded. For each file, the server verifies total byte count, decrypts and recomputes full-file SHA-256 against declared sha256, and atomically commits attachment, attachment_file, and attachment_storage rows; returns attachmentId and ordered files ([{seq, fileName, mediaType, size, sha256}]). Calling finish again on an already sealed bundle returns the same result. This tool takes no operationKey, the one exception to the write-tool key rule: the bundle began under the operationKey of artifact_begin, and finish is repeatable by its attachmentId. Refusals: ARTIFACT_INCOMPLETE when bytes are missing or the final chunk was not recorded yet (send the last chunk again or upload remaining chunks, then finish); ARTIFACT_HASH_MISMATCH when size or SHA-256 mismatches (the bytes are kept until normal expiry, nothing is deleted); ARTIFACT_EXPIRED when expired; ARTIFACT_NOT_FOUND when unknown or owned by another author. Requires at least one live grant.
tool.artifact_status=Inspect either an in-progress file upload by uploadId (kind=upload, seq, state STAGING or COMPLETED, fileName, mediaType, size, sha256, expiresAt, received, sequence) or a sealed attachment bundle by attachmentId (kind=attachment, state COMPLETED, ordered files). Supply exactly one of uploadId or attachmentId (supplying both or neither fails with VALIDATION_FAILED). Never exposes host paths or storage keys. Read-only.
tool.artifact_read=Read a byte range page from one file (seq, default 0) inside a sealed attachment bundle: offsetBytes (0 up to file size) and maxBytes (1..262144). Returns attachmentId, seq, offsetBytes, totalBytes, size, data (base64), mediaType, fileName, and text (decoded UTF-8 string when mediaType is text/* or JSON and the slice is valid UTF-8, otherwise null). Decrypts and verifies integrity on every read (ARTIFACT_CORRUPTED on tamper, ARTIFACT_NOT_FOUND when attachmentId or seq does not exist). Any authenticated author with at least one live grant may read sealed bundles. Read-only.

# ---------------------------------------------------------------- read tools (15)
tool.ledger_get=Fetch current entity type, lifecycle state, version, project_id, and merged_into for 1..200 IDs in one call (issues, specs, tasks, and criteria may be mixed). Use this before editing or transitioning to obtain expected_version, or after writes to confirm state. Unknown IDs are returned in not_found.
tool.ledger_issue=Fetch full details of one issue: metadata, symptom, root_cause, status, version, created_by, resolved_by, resolved_at, owner_actor_id, recorded deliverables, linked tasks/specs/criteria, observed cases (including cases from issues merged into this one), issue-to-issue relations (with end = a or b), last_change, and recent_changes.
tool.ledger_spec=Fetch full details of one specification: title, summary, acceptance_criteria, parent_id, child_specs, priority, status, version, created_by, completed_by, owner_actor_id, origin_ref, origin_quote, recorded deliverables, linked tasks/issues/criteria, last_change, and recent_changes.
tool.ledger_task=Fetch full details of one task: title, purpose, success_condition, origin_ref, origin_quote, state, version, created_by, completed_by, owner_actor_id, recorded deliverables, and linked issues/specs/criteria.
tool.ledger_criterion=Fetch full details of one milestone criterion: project_id, milestone_name, goal_label, code, criterion_text, state, version, created_by, linked issues/specs/tasks, last_change, and recent_changes.
tool.ledger_history=Query the immutable audit history in ascending id order, filterable by history id list, id range, entity kind, entity_id, project, operation, author_id, and UTC timestamp range. Set include_before = true to include before_data (full snake_case snapshot prior to the write). Supports keyset pagination via max_rows and cursor.
tool.ledger_search=Search issues, specs, tasks, and criteria by literal case-insensitive keywords across titles, summaries, acceptance criteria, symptoms, root causes, purposes, and criterion texts (% _ and backslash are treated literally, never as wildcards), ordered newest first. Supports match = ANY (default) or ALL, kind/status exclusions, creation time bounds, and cursor pagination.
tool.ledger_issues=List issues of a project ordered newest first, with optional exact filters for status, severity, category, attention kind, and owner, plus keyset pagination (max_rows, cursor).
tool.ledger_specs=List specifications of a project ordered newest first, with optional filters for status, parent_id, priority, owner, and attention kind, plus keyset pagination (max_rows, cursor).
tool.ledger_tasks=List tasks of a project ordered newest first, with optional filters for state, owner, and attention kind, plus keyset pagination (max_rows, cursor).
tool.ledger_criteria=List milestone criteria of a project ordered by milestone_name, code, and id, with optional filters for state and milestone_name, plus keyset pagination (max_rows, cursor).
tool.ledger_attention=List items across issues, specs, and tasks that currently require follow-up attention, filterable by project and attention kind (OPEN_WITH_DELIVERABLE, RESOLVED_WITHOUT_DELIVERABLE, OPEN_NO_OWNER, SPEC_COMPLETED_WITHOUT_DELIVERABLE, DONE_NOT_VERIFIED).
tool.ledger_stats=Return aggregate counts of issues (by status and severity), specs (by status), tasks (by state), and criteria (by state) for one project or across all projects. Pass bucket = day to include daily UTC creation counts for issues, specs, and tasks.
tool.ledger_projects=List registered projects with id, uppercase project code prefix, and title.
tool.ledger_codes=List common codes across ISSUE_CATEGORY, ISSUE_SEVERITY, RELATION_KIND, and DELIVERABLE_KIND with Korean/English labels, descriptions, sort_order, state, and relation direction (GIVEN for directed relations where endpoint order matters, CANONICAL otherwise). Pass include_inactive = true to include retired codes.

# ---------------------------------------------------------------- parameters
param.host_attestation=Optional in standard Bearer session-token mode; required in attested mode. Filled automatically by the client hook with an Ed25519 signature bound to this tool, operationKey, canonical arguments digest, and timestamp; never fabricate manually.
param.artifact_operation_key=Required. Caller-chosen idempotency key for starting this bundle upload (1..128 characters, e.g. a UUID). Repeating the same key with the same files list returns the existing attachmentId and uploadIds; the server never makes a key up.
param.artifact_files=Required. Ordered list of 1..64 files to stage in the bundle (assigned seq 0, 1, ...), each specifying fileName, mediaType, size, and sha256.
param.artifact_file_name=File name (1..512 characters, no backslashes or control characters).
param.artifact_media_type=MIME media type in type/subtype form (e.g. text/markdown, application/json, image/png, video/mp4).
param.artifact_size=Exact raw file size in bytes (0 up to server maxFileBytes).
param.artifact_sha256=Full-file SHA-256 digest (64 lowercase hex characters), verified on artifact_finish.
param.artifact_purpose=Optional upload purpose; only evidence is supported and is the default when omitted.
param.artifact_upload_id=Per-file uploadId returned in files[] by artifact_begin.
param.artifact_sequence=Zero-based chunk sequence number (0, 1, 2, ...); supply the next expected sequence, or repeat the last applied sequence to recover from a lost response.
param.artifact_data=Base64-encoded chunk bytes (at most 262144 raw bytes before base64 encoding, 349528 characters).
param.artifact_chunk_sha256=SHA-256 digest of this chunk's raw bytes (64 lowercase hex characters).
param.artifact_status_upload_id=In-progress per-file uploadId to inspect. Supply exactly one of uploadId or attachmentId.
param.artifact_status_attachment_id=Sealed bundle attachmentId to inspect. Supply exactly one of uploadId or attachmentId.
param.artifact_attachment_id=Bundle attachmentId returned by artifact_begin / artifact_finish.
param.artifact_seq=Zero-based file index inside the bundle (defaults to 0 when omitted).
param.artifact_offset_bytes=Byte offset where the page starts (0 up to total file bytes).
param.artifact_max_bytes=Maximum bytes to read in this page (1..262144).
param.operation_key=Required. Caller-chosen idempotency key for this write (1..128 characters, e.g. a UUID). Retrying the same key with identical arguments replays the stored result without writing twice; reusing the key with different arguments fails with OPERATION_CONFLICT. The server never makes a key up.
param.batch_operation_key=Required. Caller-chosen idempotency key for the whole batch (1..128 characters, e.g. a UUID). Retrying the same key with identical operations replays the stored batch result; reusing it with different operations fails with OPERATION_CONFLICT. Individual operations carry no key of their own.
param.reason=Clear explanation for the audit history (10..1000 characters).
param.case_reason=Why this occurrence is being recorded (10..1000 characters).
param.correct_reason=Why the target history entry was erroneous (10..1000 characters).
param.entity=Target entity kind: issue, spec, task, or criterion.
param.review_entity=Entity kind to verify or reopen: issue, spec, task, or criterion.
param.id=Target record ID.
param.issue_save_id=Issue ID (<PROJECT_CODE>-I-NNNN). Omit when creating to auto-allocate the next ID; required when editing (expected_version > 0).
param.spec_save_id=Specification ID (<PROJECT_CODE>-S-NNNN or free-text ID up to 128 chars). Omit when creating to auto-allocate the next <PROJECT_CODE>-S-NNNN ID; required when editing.
param.task_save_id=Task ID (<PROJECT_CODE>-T-NNNN or free-text ID up to 128 chars). Omit when creating to auto-allocate the next <PROJECT_CODE>-T-NNNN ID; required when editing.
param.criterion_save_id=Required milestone criterion ID (1..128 characters of ASCII letters, digits, ., _, :, -), e.g. PROJ-C-M1-01. Required on both create and edit.
param.expected_version=Current version of the row for optimistic locking (call ledger_get first if unknown).
param.save_expected_version=0 or omitted to create a new record; positive current row version to edit an existing record (optimistic lock).
param.transition_to=Target author-channel state for the given entity (reviewer states VERIFIED, MET, and NOT_MET require ledger_review).
param.review_to=Target reviewer state (VERIFIED, MET, NOT_MET) or the reopened state when returning a verified record to active work.
param.evidence_uri=URI or reference identifying the supporting evidence (inspection report, artifact bundle, test log, or review record; 1..2000 characters).
param.review_evidence_uri=Required URI or reference to the independent verification evidence inspected by the reviewer (1..2000 characters).
param.evidence_sha256=Optional 64-character lowercase hex SHA-256 of the evidence content.
param.merged_into=Canonical target issue ID when transitioning an issue to MERGED.
param.issue_id=Issue ID (<PROJECT_CODE>-I-NNNN or imported <PROJECT_CODE>-D-NNNN).
param.spec_id=Specification ID.
param.task_id=Task ID.
param.criterion_id=Milestone criterion ID.
param.target_entity=Entity kind owning the deliverable: issue, spec, or task.
param.target_id=ID of the target issue, spec, or task.
param.deliverable_kind=Active DELIVERABLE_KIND code classifying the output (e.g. code_change, document, media, design, dataset, specification, artifact, other).
param.deliverable_ref=Immutable identifier or revision reference of the deliverable (e.g. commit hash, document version tag, cut/render ID, archive digest; 1..500 characters).
param.deliverable_location=Optional repository, container, storage URI, or collection where deliverable_ref lives (up to 500 characters).
param.deliverable_summary=Required concise summary of what was produced or changed in this deliverable (1..4000 characters).
param.check_ref=Optional reference or URL of an automated or procedural check run; required when check_result is supplied or when amending check metadata on an existing deliverable.
param.check_result=Optional check outcome metadata: passed, failed, or cancelled (never a substitute for independent ledger_review).
param.checked_at=Optional UTC ISO-8601 timestamp when the check finished.
param.mark_done=When true or omitted on a new deliverable, automatically transitions an OPEN issue to RESOLVED or a non-completed spec to COMPLETED; set false to keep current state.
param.observation=Concrete description of what was observed (1..4000 characters).
param.case_evidence=Optional locator where the observation can be verified (log reference, timecode, page/section, file:line, or URI; up to 2000 characters).
param.source_quote=Optional verbatim quote from the reporter, reviewer, or primary source (up to 2000 characters).
param.observed_at=Optional UTC ISO-8601 timestamp when the occurrence happened.
param.kind=Link kind: one of the six fixed cross-entity kinds (issue_task, issue_spec, spec_task, criterion_task, criterion_issue, criterion_spec) or an active RELATION_KIND between two issues.
param.link_a=First endpoint ID. For directed issue relations it is the subject: the issue caused by b (caused_by) or the issue that blocks b (blocks).
param.link_b=Second endpoint ID. For directed issue relations it is the object: the root-cause issue (caused_by) or the blocked issue (blocks).
param.remove=Set true to remove an existing link instead of creating it (defaults to false).
param.history_id=History entry ID to mark as corrected.
param.ops=Ordered list of 1..200 batch operation objects ({op, ...}).
param.attachment_id=Optional UUID of a sealed attachment bundle (returned by artifact_finish) owned by the caller to link to this history entry. Non-UUID or foreign attachment IDs fail the entire write atomically.

param.ids=List of 1..200 entity IDs to look up (issues, specs, tasks, and criteria may be mixed).
param.project=Project ID (lowercase letters, digits, underscores, hyphens; e.g. my_project).
param.max_rows=Maximum items per page, 1..1000 (default 50). When more rows exist, truncated is true and next_cursor holds the keyset token.
param.cursor=Opaque next_cursor token from the previous page of the exact same query and filters.
param.history_ids=Explicit list of history entry IDs to fetch (1..200).
param.id_from=Minimum history entry ID (inclusive).
param.id_to=Maximum history entry ID (inclusive).
param.history_entity=Filter history by entity kind.
param.entity_id=Filter history by exact entity ID.
param.op=Filter history by operation kind (CREATE, EDIT, TRANSITION, LINK, UNLINK, CORRECT).
param.history_author_id=Author of the history entry.
param.at_from=Earliest history timestamp (UTC ISO-8601, inclusive).
param.at_to=Latest history timestamp (UTC ISO-8601, inclusive).
param.include_before=When true, include before_data containing the full snake_case row snapshot before the change.
param.search_kinds=Entity kinds to search: issue, spec, task, criterion (defaults to all four).
param.keywords=1..20 literal search keywords (1..200 characters each).
param.match=Keyword matching mode: ANY matches at least one keyword (default); ALL requires every keyword to match.
param.exclude_status=Lifecycle status/state names to exclude from search results.
param.created_from=Earliest creation timestamp (UTC ISO-8601, inclusive).
param.created_to=Latest creation timestamp (UTC ISO-8601, inclusive).
param.issue_status=Filter issues by status.
param.spec_status=Filter specifications by status.
param.parent_spec_id=Filter specifications by parent specification ID.
param.priority_filter=Filter specifications by exact priority label.
param.severity=Filter issues by severity code (active or retired, such as P1, P2, P3, UNRATED).
param.category=Filter issues by category code.
param.attention_kind=Filter rows to a specific follow-up attention condition.
param.attention_filter=Return only items matching this attention kind.
param.owner=Filter by owner author ID (e.g. role or session author identifier).
param.task_state=Filter tasks by state.
param.criterion_state=Filter milestone criteria by state.
param.milestone_name=Filter milestone criteria by exact milestone name.
param.bucket=Pass day to include per-UTC-day creation counts for issues, specs, and tasks.
param.code_group=Filter common codes to one group (ISSUE_CATEGORY, ISSUE_SEVERITY, RELATION_KIND, DELIVERABLE_KIND).
param.include_inactive=When true, include retired (INACTIVE) codes alongside active codes.

# ---------------------------------------------------------------- entity fields (flat save tools & batch SaveFields)
field.project_id=Project ID owning the record (required when creating; forbidden when editing an issue; moves a spec, task, or criterion when changed on edit).
field.parent_id=Optional parent specification ID within the same project (empty string clears parent_id on edit).
field.title=Concise title (1..500 characters; required when creating an issue, spec, or task).
field.category=Active ISSUE_CATEGORY code classifying the issue.
field.severity=Active ISSUE_SEVERITY code rating impact (P1, P2, P3; required unless status is NOT_AN_ISSUE or MERGED).
field.symptom=Observed symptom, discrepancy, or problem behavior (up to 20000 characters; required when creating an issue, may be empty string).
field.root_cause=Identified or hypothesized underlying cause (up to 20000 characters; required when creating an issue, may be empty string).
field.summary=Specification overview and scope summary (up to 20000 characters; empty string clears on edit).
field.acceptance_criteria=Verifiable completion and review criteria for the specification (up to 20000 characters; empty string clears on edit).
field.priority=Optional priority label for ordering specifications (1..64 characters; empty string clears on edit).
field.owner_actor_id=Assigned owner author ID (<prefix>:<id>); pass an empty string on edit to clear ownership.
field.purpose=Why this task exists and what outcome it serves (up to 20000 characters; empty string clears on edit).
field.success_condition=Concrete condition that marks the task ready to report done (up to 20000 characters; empty string clears on edit).
field.origin_ref=Optional reference to the originating request, document, scene, or ticket (up to 500 characters; empty string clears on edit).
field.origin_quote=Optional verbatim excerpt from the originating request or stakeholder instruction (up to 4000 characters; empty string clears on edit).
field.milestone_name=Milestone, release, cut, or publication stage name (1..120 characters; required when creating a criterion).
field.goal_label=Optional grouping goal label within the milestone (up to 200 characters; empty string clears on edit).
field.code=Short criterion code unique within (project_id, milestone_name) (1..64 characters; required when creating a criterion).
field.criterion_text=Full statement of the milestone acceptance criterion (1..4000 characters; required when creating a criterion).
