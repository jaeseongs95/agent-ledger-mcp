# 한국어 MCP 도구·파라미터 설명 번들 (도메인 중립 2.0 범용 장부 계약)

catalog.empty=활성 상태인 {0} 공통 코드가 아직 없습니다. 다음 명령으로 추가하세요: ledger-cli code-set {0} CODE NAME

# ---------------------------------------------------------------- 쓰기 도구 (13)
tool.ledger_issue_save=모든 분야(영상 제작 중단 요소, 원고·편집 오류, 연구·운영 이상, 품질 결함 등)의 이슈(issue)를 생성(expected_version = 0 또는 생략)하거나 편집(expected_version = 현재 버전)합니다. 생성 시 project_id, title, symptom, root_cause는 필수이며 category와 severity는 활성 ISSUE_CATEGORY·ISSUE_SEVERITY 코드여야 합니다. id를 생략하면 다음 <PROJECT_CODE>-I-NNNN 번호가 자동 부여됩니다. 편집 시 id와 expected_version이 필수이며 project_id는 변경할 수 없고(PROJECT_MOVE_FORBIDDEN), 최소 한 개 이상의 필드를 지정해야 하며 생략·null은 유지, 빈 문자열("")은 선택 필드를 비웁니다. VERIFIED 상태인 이슈는 독립 검수자가 ledger_review로 재개방하기 전까지 편집할 수 없습니다(VERIFIED_ENTITY). 필요 권한: issue.
tool.ledger_spec_save=기능·장면·원고·설계·산출물 명세(spec)를 생성(expected_version = 0 또는 생략, 초기 상태 PLANNED)하거나 편집(expected_version = 현재 버전)합니다. 생성 시 project_id와 title이 필수이며 summary, acceptance_criteria, parent_id, priority, owner_actor_id, origin_ref, origin_quote는 선택입니다. id 생략 시 다음 <PROJECT_CODE>-S-NNNN ID가 부여되며 자유 형식 ID도 지정할 수 있습니다. 편집 시 생략·null은 유지, 빈 문자열("")은 선택 필드를 비웁니다. VERIFIED 명세는 ledger_review로 재개방하기 전까지 편집할 수 없습니다(VERIFIED_ENTITY). 완료 보고는 ledger_record_deliverable 또는 ledger_transition(COMPLETED), 독립 검수는 ledger_review(VERIFIED)를 사용합니다. 필요 권한: spec.
tool.ledger_task_save=실행 단위 작업(task)을 생성(expected_version = 0 또는 생략, 초기 상태 PLANNED)하거나 편집(expected_version = 현재 버전)합니다. 생성 시 project_id와 title이 필수이며 purpose, success_condition, owner_actor_id, origin_ref, origin_quote는 선택입니다. id 생략 시 다음 <PROJECT_CODE>-T-NNNN ID가 부여되며 자유 형식 ID도 허용됩니다. 편집 시 생략·null은 유지, 빈 문자열("")은 선택 필드를 비웁니다. VERIFIED 작업은 ledger_review로 재개방하기 전까지 편집할 수 없습니다(VERIFIED_ENTITY). 필요 권한: task.
tool.ledger_criterion_save=마일스톤·출시·발간 판정 기준(milestone_criterion)을 생성(expected_version = 0 또는 생략, 초기 상태 UNKNOWN)하거나 편집(expected_version = 현재 버전)합니다. 생성·편집 모두 명시적 id가 필수이며, 생성 시 project_id, id, milestone_name, code(프로젝트+마일스톤 내 유일), criterion_text가 필수이고 goal_label은 선택입니다. MET 또는 NOT_MET 상태인 기준은 ledger_review로 재개방하기 전까지 편집할 수 없습니다(VERIFIED_ENTITY). 필요 권한: task.
tool.ledger_transition=이슈, 명세, 작업, 마일스톤 기준의 작성자 채널 상태를 전이합니다(불변 이력 1건 기록). 이슈: OPEN, RESOLVED(산출물 1건 이상 필요), NOT_AN_ISSUE·DISPUTED(evidence_uri 필수), MERGED(merged_into 필수). 명세: DRAFT, PLANNED, ACTIVE, BLOCKED, COMPLETED(evidence_uri 필수), CANCELLED. 작업: PLANNED, ACTIVE, BLOCKED, COMPLETED(evidence_uri 필수), CANCELLED. 기준: UNKNOWN, PLANNED, ACTIVE, COMPLETED(evidence_uri 필수). 독립 검수 상태(VERIFIED, MET, NOT_MET)로의 진입 및 재개방은 반드시 ledger_review를 사용합니다.
tool.ledger_record_deliverable=이슈, 명세, 작업을 위해 산출된 결과물(코드 변경, 문서 원고, 편집본·렌더링 미디어, 도면·시안, 데이터셋, 명세 판본, 완제품 아티팩트 등)을 기록하거나 기존 산출물의 점검 결과를 갱신합니다. 새 산출물을 기록하면 대상의 owner_actor_id가 기록 세션으로 갱신되며 created_by는 보존됩니다. mark_done이 생략되거나 true이면 OPEN 이슈는 RESOLVED로, 미완료 명세는 COMPLETED로 같은 트랜잭션에서 전이됩니다(중간 산출물만 기록하려면 mark_done = false). VERIFIED 대상은 재개방 전까지 거부됩니다. 필요 권한: deliverable 및 대상 엔티티 권한(issue/spec/task).
tool.ledger_record_case=이슈 아래에 관측 사례(재현 기록, 현장 메모, 제보 원문 등) 1건을 추가합니다. 병합된(MERGED) 이슈에는 기록할 수 없으며 병합 대상 이슈에 기록해야 합니다. 필요 권한: issue.
tool.ledger_link=두 장부 항목 간 연결을 추가하거나 remove = true로 해제합니다. 고정 교차 연결: issue_task, issue_spec, spec_task, criterion_task, criterion_issue, criterion_spec. 이슈 간 관계(RELATION_KIND): 방향성 있는 관계(caused_by: a의 원인이 b, blocks: a가 b를 차단)는 a가 주어, b가 목적어이며 해제 시에도 같은 순서로 전달해야 합니다. 방향성 없는 관계는 순서와 무관하게 하나의 관계로 저장됩니다.
tool.ledger_correct=작성자 채널 이력 항목을 잘못된 기록으로 표시하는 불변 CORRECT 이력을 추가합니다(기존 이력은 수정·삭제되지 않음). 검수 이력 정정은 ledger_review_correct를 사용합니다.
tool.ledger_batch=1..200개의 작성자 채널 쓰기 작업({op: save | transition | record_deliverable | record_case | link | correct, ...})을 단일 트랜잭션으로 원자 실행합니다. 하나라도 실패하면 전체 롤백되며 op_index와 op가 반환됩니다. 배치 전체에 하나의 operationKey만 부여하며 개별 항목에는 키를 넣지 않습니다.
tool.ledger_review=독립 검수자 전용 검증 및 재개방 전이 도구입니다. 이슈(RESOLVED -> VERIFIED), 명세(COMPLETED -> VERIFIED), 작업(COMPLETED -> VERIFIED)은 evidence_uri가 필수이며 생성·소유·사례 기록·완료 보고·산출물 작성에 참여한 적 없는 독립 세션만 수행할 수 있습니다(SAME_SESSION). 기준(MET / NOT_MET) 역시 evidence_uri와 생성·편집에 참여하지 않은 독립 세션이 필요합니다. 자동 점검 결과는 선택적 메타데이터이며 검수자는 실제 산출물을 직접 확인해야 합니다. 재작업 요청은 created_by가 아니라 실제 작업을 수행한 세션(ledger_issue의 resolved_by, ledger_spec·ledger_task의 completed_by)으로 전달하세요. 필요 권한: verify.
tool.ledger_review_correct=검수 채널 이력 항목을 잘못된 기록으로 표시하는 CORRECT 이력을 추가합니다. 필요 권한: verify.
tool.ledger_whoami=현재 호출자의 인증된 작성자 ID(표준 Bearer 세션 토큰 또는 서명된 _hostAttestation), ID 형식 유효성, 검수 가능 채널 여부, 활성 권한 목록(project, scope, expires_at)을 읽기 전용으로 조회합니다.

# ---------------------------------------------------------------- 첨부 도구 (5)
tool.artifact_begin=장부 기록에서 참조할 증빙·참고 파일 번들 업로드를 시작합니다. 파일은 다섯 개의 artifact_* 도구로만 장부에 적재되며 서버는 호출자 PC 경로를 직접 읽지 않습니다. operationKey(필수, 1..128자)와 동일한 files 목록으로 재호출하면 같은 attachmentId와 uploadId 목록을 반환합니다. 1..64개 파일을 순서대로 선언한 뒤 artifact_chunk(최대 262144바이트)로 전송하고 artifact_finish(attachmentId)로 봉인하세요. 최소 1개 이상의 활성 권한이 필요합니다.
tool.artifact_chunk=번들 내 개별 파일 업로드(uploadId)의 다음 청크를 전송합니다. sequence는 0부터 시작하며 data는 base64(원본 최대 262144바이트, 349528자), chunkSha256은 원본 바이트의 64자 소문자 16진수 SHA-256입니다. 마지막 적용 청크를 같은 내용으로 재전송하면 현재 상태를 그대로 반환하므로 응답 유실 시 안전하게 재시도할 수 있습니다. 이 도구는 operationKey를 받지 않습니다.
tool.artifact_finish=번들의 모든 파일 청크 전송이 끝난 뒤 전체 크기와 SHA-256 해시를 검증하고 첨부 번들을 원자적으로 확정합니다. 완료된 번들에 다시 호출하면 동일한 결과를 반환합니다. 이 도구는 operationKey를 받지 않습니다. 최소 1개 이상의 활성 권한이 필요합니다.
tool.artifact_status=진행 중인 개별 파일 업로드(uploadId) 또는 확정된 첨부 번들(attachmentId)의 상태를 조회합니다. uploadId와 attachmentId 중 정확히 하나만 지정해야 합니다. 읽기 전용입니다.
tool.artifact_read=확정된 첨부 번들 내 파일(seq, 기본값 0)의 지정 구간(offsetBytes, maxBytes 1..262144)을 복호화·무결성 검증하여 읽습니다. 텍스트/JSON 미디어 타입이고 유효한 UTF-8이면 text 필드에 원문 문자열도 함께 반환됩니다. 최소 1개 이상의 활성 권한이 필요합니다. 읽기 전용입니다.

# ---------------------------------------------------------------- 읽기 도구 (15)
tool.ledger_get=1..200개 ID(이슈·명세·작업·기준 혼합 가능)의 엔티티 종류, 현재 상태, 버전, 프로젝트 ID, 병합 대상을 한 번에 조회합니다. 편집·전이 전 expected_version 확인용으로 사용하세요.
tool.ledger_issue=단일 이슈의 전체 상세(증상, 근본 원인, 상태, 버전, 산출물 목록, 연결된 작업·명세·기준, 병합 체인을 포함한 관측 사례, 관계, 최근 변경 이력)를 조회합니다.
tool.ledger_spec=단일 명세의 전체 상세(제목, 요약, 수용 기준, 상위·하위 명세, 우선순위, 상태, 버전, 완료 보고자, 산출물 목록, 연결된 작업·이슈·기준, 최근 변경 이력)를 조회합니다.
tool.ledger_task=단일 작업의 전체 상세(제목, 목적, 완료 조건, 출처, 상태, 버전, 완료 보고자, 산출물 목록, 연결된 이슈·명세·기준)를 조회합니다.
tool.ledger_criterion=단일 마일스톤 기준의 전체 상세(마일스톤명, 목표 라벨, 코드, 기준 본문, 상태, 버전, 연결된 이슈·명세·작업, 최근 변경 이력)를 조회합니다.
tool.ledger_history=불변 감사 이력을 ID 오름차순으로 조회합니다(ID 목록·범위, 엔티티, 프로젝트, 작업 종류, 작성자, 시간 범위 필터 및 include_before 변경 전 스냅샷 지원).
tool.ledger_search=이슈, 명세, 작업, 기준에서 대소문자 구분 없는 리터럴 키워드로 검색합니다(% _ 백슬래시는 와일드카드가 아닌 일반 문자로 처리). match = ANY(기본값) 또는 ALL을 지원합니다.
tool.ledger_issues=프로젝트의 이슈 목록을 최신순으로 조회합니다(상태, 심각도, 분류, 주의 항목, 담당자 필터 및 커서 페이지네이션 지원).
tool.ledger_specs=프로젝트의 명세 목록을 최신순으로 조회합니다(상태, 상위 명세, 우선순위, 담당자, 주의 항목 필터 및 커서 페이지네이션 지원).
tool.ledger_tasks=프로젝트의 작업 목록을 최신순으로 조회합니다(상태, 담당자, 주의 항목 필터 및 커서 페이지네이션 지원).
tool.ledger_criteria=프로젝트의 마일스톤 기준 목록을 조회합니다(상태, 마일스톤명 필터 및 커서 페이지네이션 지원).
tool.ledger_attention=추가 조치가 필요한 이슈·명세·작업 주의 항목(OPEN_WITH_DELIVERABLE, RESOLVED_WITHOUT_DELIVERABLE, OPEN_NO_OWNER, SPEC_COMPLETED_NOT_VERIFIED, TASK_UNKNOWN, DONE_NOT_VERIFIED)을 조회합니다.
tool.ledger_stats=프로젝트별 또는 전체의 이슈·명세·작업·기준 상태별 집계를 반환합니다. bucket = day 지정 시 UTC 일자별 신규 생성 건수를 함께 반환합니다.
tool.ledger_projects=등록된 프로젝트 목록(id, 대문자 코드 접두사, 제목)을 조회합니다.
tool.ledger_codes=공통 코드(ISSUE_CATEGORY, ISSUE_SEVERITY, RELATION_KIND, DELIVERABLE_KIND) 목록과 한·영 명칭, 설명, 정렬 순서, 관계 방향성을 조회합니다.

# ---------------------------------------------------------------- 파라미터
param.host_attestation=표준 Bearer 세션 토큰 모드에서는 선택이며, attested 모드에서는 클라이언트 훅이 자동으로 채우는 Ed25519 서명 토큰입니다(수동 입력 금지).
param.artifact_operation_key=필수. 번들 업로드 시작의 멱등성 키(1..128자, 예: UUID)입니다.
param.artifact_files=필수. 번들에 포함할 1..64개 파일 선언 목록입니다.
param.artifact_file_name=파일 이름(1..512자, 백슬래시 및 제어문자 금지)입니다.
param.artifact_media_type=type/subtype 형식의 미디어 타입입니다.
param.artifact_size=파일의 정확한 바이트 크기입니다.
param.artifact_sha256=전체 파일의 64자 소문자 16진수 SHA-256 해시입니다.
param.artifact_purpose=선택 목적 값(기본값이자 유일한 지원값은 evidence)입니다.
param.artifact_upload_id=artifact_begin이 반환한 파일별 uploadId입니다.
param.artifact_sequence=0부터 시작하는 청크 순번입니다.
param.artifact_data=Base64 인코딩된 청크 데이터(원본 최대 262144바이트, 349528자)입니다.
param.artifact_chunk_sha256=해당 청크 원본 바이트의 64자 소문자 16진수 SHA-256 해시입니다.
param.artifact_status_upload_id=조회할 진행 중 업로드 ID(uploadId와 attachmentId 중 하나만 지정)입니다.
param.artifact_status_attachment_id=조회할 확정 첨부 번들 ID(uploadId와 attachmentId 중 하나만 지정)입니다.
param.artifact_attachment_id=첨부 번들 ID입니다.
param.artifact_seq=번들 내 0-기반 파일 순번(생략 시 0)입니다.
param.artifact_offset_bytes=읽기 시작 바이트 오프셋입니다.
param.artifact_max_bytes=읽을 최대 바이트 수(1..262144)입니다.
param.operation_key=필수. 호출자가 직접 지정하는 쓰기 멱등성 키(1..128자, 예: UUID)입니다. 같은 키와 같은 인자로 재호출하면 저장된 응답을 재생합니다.
param.batch_operation_key=필수. 배치 전체에 대한 멱등성 키(1..128자, 예: UUID)입니다. 개별 연산 항목에는 키를 넣지 않습니다.
param.reason=감사 이력에 남길 변경 사유(10..1000자)입니다.
param.case_reason=관측 사례를 기록하는 사유(10..1000자)입니다.
param.correct_reason=대상 이력이 잘못된 이유(10..1000자)입니다.
param.entity=대상 엔티티 종류(issue, spec, task, criterion)입니다.
param.review_entity=검수 또는 재개방할 엔티티 종류(issue, spec, task, criterion)입니다.
param.id=대상 행 ID입니다.
param.issue_save_id=이슈 ID(<PROJECT_CODE>-I-NNNN). 생성 시 생략하면 자동 채번되며 편집 시 필수입니다.
param.spec_save_id=명세 ID(<PROJECT_CODE>-S-NNNN 또는 자유 형식 ID). 생성 시 생략하면 자동 채번되며 편집 시 필수입니다.
param.task_save_id=작업 ID(<PROJECT_CODE>-T-NNNN 또는 자유 형식 ID). 생성 시 생략하면 자동 채번되며 편집 시 필수입니다.
param.criterion_save_id=필수 마일스톤 기준 ID(1..128자 영숫자 및 ._:-)입니다. 생성과 편집 모두 필수입니다.
param.expected_version=낙관적 잠금용 현재 행 버전입니다.
param.save_expected_version=생성 시 0 또는 생략, 편집 시 현재 행의 양수 버전입니다.
param.transition_to=전이할 작성자 채널 목표 상태입니다(VERIFIED, MET, NOT_MET은 ledger_review 사용).
param.review_to=검수 목표 상태(VERIFIED, MET, NOT_MET) 또는 재개방할 상태입니다.
param.evidence_uri=근거 자료 URI 또는 참조 식별자(1..2000자)입니다.
param.review_evidence_uri=필수. 독립 검수자가 직접 확인한 검증 근거 URI 또는 참조(1..2000자)입니다.
param.evidence_sha256=근거 파일의 선택적 64자 소문자 16진수 SHA-256 해시입니다.
param.merged_into=MERGED 전이 시 병합 대상 이슈 ID입니다.
param.issue_id=이슈 ID입니다.
param.spec_id=명세 ID입니다.
param.task_id=작업 ID입니다.
param.criterion_id=마일스톤 기준 ID입니다.
param.target_entity=산출물이 속한 대상 엔티티 종류(issue, spec, task)입니다.
param.target_id=대상 이슈, 명세 또는 작업 ID입니다.
param.deliverable_kind=산출물 분류 코드(DELIVERABLE_KIND 활성 코드)입니다.
param.deliverable_ref=산출물의 불변 참조 식별자(커밋 해시, 원고 판본, 편집 컷 ID, 아카이브 해시 등, 1..500자)입니다.
param.deliverable_location=산출물이 위치한 저장소·보관소·경로 참조(최대 500자, 선택)입니다.
param.deliverable_summary=산출물 핵심 내용 요약(1..4000자, 필수)입니다.
param.check_ref=점검·시험 실행 참조 또는 URL(check_result 지정 시 또는 기존 산출물 갱신 시 필수)입니다.
param.check_result=점검 결과 메타데이터(passed, failed, cancelled)입니다.
param.checked_at=점검 완료 시각(UTC ISO-8601, 선택)입니다.
param.mark_done=새 산출물 기록 시 OPEN 이슈를 RESOLVED로, 미완료 명세를 COMPLETED로 함께 전이할지 여부(기본값 true)입니다.
param.observation=관측된 현상 설명(1..4000자)입니다.
param.case_evidence=관측 근거 위치(로그, 타임코드, 쪽·절, 파일:줄, URI 등 최대 2000자)입니다.
param.source_quote=제보자·원문 인용문(최대 2000자, 선택)입니다.
param.observed_at=관측 시각(UTC ISO-8601, 선택)입니다.
param.kind=연결 종류(고정 교차 연결 6종 또는 이슈 간 RELATION_KIND 코드)입니다.
param.link_a=첫 번째 ID입니다. 방향성 관계에서는 주어(caused_by의 결과 이슈, blocks의 차단 주체)입니다.
param.link_b=두 번째 ID입니다. 방향성 관계에서는 목적어(caused_by의 원인 이슈, blocks의 피차단 이슈)입니다.
param.remove=true이면 연결을 해제합니다(기본값 false).
param.history_id=정정 표시할 이력 ID입니다.
param.ops=원자 실행할 1..200개 작업 객체 배열입니다.
param.attachment_id=이력에 연결할 본인 소유의 확정 첨부 번들 UUID(artifact_finish 반환값, 선택)입니다.

param.ids=조회할 1..200개 엔티티 ID 목록입니다.
param.project=프로젝트 ID입니다.
param.max_rows=페이지당 최대 행 수(1..1000, 기본값 50)입니다.
param.cursor=이전 페이지 응답의 next_cursor 토큰입니다.
param.history_ids=조회할 이력 ID 목록(1..200개)입니다.
param.id_from=최소 이력 ID(포함)입니다.
param.id_to=최대 이력 ID(포함)입니다.
param.history_entity=이력 엔티티 종류 필터입니다.
param.entity_id=대상 엔티티 ID 필터입니다.
param.op=이력 연산 종류 필터입니다.
param.history_author_id=이력 작성자 ID 필터입니다.
param.at_from=조회 시작 시각(UTC ISO-8601, 포함)입니다.
param.at_to=조회 종료 시각(UTC ISO-8601, 포함)입니다.
param.include_before=true이면 변경 전 전체 스냅샷(before_data)을 함께 반환합니다.
param.search_kinds=검색 대상 종류(issue, spec, task, criterion; 기본값 전체)입니다.
param.keywords=1..20개의 검색 키워드(각 1..200자)입니다.
param.match=키워드 일치 방식(ANY: 하나 이상 일치 기본값, ALL: 모두 일치)입니다.
param.exclude_status=검색 결과에서 제외할 상태 목록입니다.
param.created_from=생성 시작 시각(UTC ISO-8601, 포함)입니다.
param.created_to=생성 종료 시각(UTC ISO-8601, 포함)입니다.
param.issue_status=이슈 상태 필터입니다.
param.spec_status=명세 상태 필터입니다.
param.parent_spec_id=상위 명세 ID 필터입니다.
param.priority_filter=명세 우선순위 필터입니다.
param.severity=이슈 심각도 코드 필터입니다.
param.category=이슈 분류 코드 필터입니다.
param.attention_kind=주의 항목 종류 필터입니다.
param.attention_filter=특정 주의 항목 종류만 조회합니다.
param.owner=담당자 작성자 ID 필터입니다.
param.task_state=작업 상태 필터입니다.
param.criterion_state=마일스톤 기준 상태 필터입니다.
param.milestone_name=마일스톤명 필터입니다.
param.bucket=day 지정 시 UTC 일자별 신규 생성 건수를 포함합니다.
param.code_group=공통 코드 그룹 필터입니다.
param.include_inactive=true이면 비활성(폐기) 코드도 함께 조회합니다.

# ---------------------------------------------------------------- 엔티티 필드
field.project_id=소유 프로젝트 ID(생성 시 필수; 이슈 편집 시 변경 불가; 명세·작업·기준 편집 시 프로젝트 이동)입니다.
field.parent_id=같은 프로젝트 내 상위 명세 ID(편집 시 빈 문자열이면 해제)입니다.
field.title=제목(1..500자; 이슈·명세·작업 생성 시 필수)입니다.
field.category=이슈 분류 코드(ISSUE_CATEGORY 활성 코드)입니다.
field.severity=이슈 심각도 코드(ISSUE_SEVERITY 활성 코드: P1, P2, P3)입니다.
field.symptom=관측된 증상 또는 문제 현상(최대 20000자; 이슈 생성 시 필수, 빈 문자열 허용)입니다.
field.root_cause=확인되었거나 추정되는 근본 원인(최대 20000자; 이슈 생성 시 필수, 빈 문자열 허용)입니다.
field.summary=명세 요약 및 범위 설명(최대 20000자; 편집 시 빈 문자열이면 비움)입니다.
field.acceptance_criteria=검증 가능한 명세 완료·수용 기준(최대 20000자; 편집 시 빈 문자열이면 비움)입니다.
field.priority=명세 우선순위 라벨(1..64자; 편집 시 빈 문자열이면 비움)입니다.
field.owner_actor_id=담당 작성자 ID(편집 시 빈 문자열이면 담당자 해제)입니다.
field.purpose=작업의 목적과 배경(최대 20000자; 편집 시 빈 문자열이면 비움)입니다.
field.success_condition=작업 완료 판정 조건(최대 20000자; 편집 시 빈 문자열이면 비움)입니다.
field.origin_ref=원천 요청·문서·장면 참조(최대 500자; 편집 시 빈 문자열이면 비움)입니다.
field.origin_quote=원천 요청 원문 인용(최대 4000자; 편집 시 빈 문자열이면 비움)입니다.
field.milestone_name=마일스톤·출시·발간 단계 이름(1..120자; 기준 생성 시 필수)입니다.
field.goal_label=마일스톤 내 상위 목표 라벨(최대 200자; 편집 시 빈 문자열이면 비움)입니다.
field.code=프로젝트+마일스톤 내 유일한 기준 코드(1..64자; 기준 생성 시 필수)입니다.
field.criterion_text=마일스톤 판정 기준 본문(1..4000자; 기준 생성 시 필수)입니다.
