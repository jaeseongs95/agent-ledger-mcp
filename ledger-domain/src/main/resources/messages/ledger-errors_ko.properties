# 한국어 메시지 패턴 (java.text.MessageFormat). 오류 코드마다 error.<TOKEN> 키 하나.
error.HOST_ATTESTATION_REQUIRED=호스트 훅이 세션을 넣지 않았습니다(pg-ledger-mcp 클라이언트 훅 설치 필요).
error.AUTHOR_ID_FORMAT=author_id는 <vendor>:<session-id>(vendor는 소문자, 예: claude:1234abcd) 또는 user:owner 형식이어야 합니다(받은 값: {0}).
error.SESSION_NOT_GRANTED={0}에게 프로젝트 {2}의 유효한 {1} 부여가 없습니다.
error.VERIFY_NEEDS_REVIEWER_LOGIN=검증은 검토자 채널로만 기록할 수 있습니다.
error.ATTESTATION_UNSIGNED=호스트 증명에 서명이 없습니다(옛 훅은 <vendor>:<session-id>만 보냅니다). pg-ledger-mcp 클라이언트 훅을 갱신하세요.
error.ATTESTATION_MALFORMED=호스트 증명이 올바른 서명 증명이 아닙니다.
error.ATTESTATION_SIGNATURE_INVALID=호스트 증명을 확인할 수 없습니다. 서명이 이 서버에 등록된 세션 키와 맞지 않거나, 이 작성자의 세션 키가 이 서버에 등록되어 있지 않습니다. 키가 새것이면 훅 명령 session-key <서버 이름> <작성자>가 출력한 공개 키와 지문을 소유자에게 보여 주고, 소유자가 이 서버에 등록하게 하세요.
error.ATTESTATION_BINDING_MISMATCH=호스트 증명이 이 호출의 {0}와 다른 값에 대해 서명되었습니다. (tool=호출한 도구, operationKey=작업 키, arguments=호출 인자 전체)
error.ATTESTATION_TIME_WINDOW=호스트 증명의 발급 시각이 서버 시각에서 {0}초보다 더 벗어났습니다. 훅을 실행하는 기계의 시계를 확인하세요.
# {0}은 경로(예외의 유일한 인자), {1}은 호출하는 쪽이 첫 이슈의 이유를 ledger-reasons의 reason.<NAME>에서 찾아 넣는 문장이다.
error.VALIDATION_FAILED={0}: {1}
error.REASON_INVALID=reason은 10~1000자여야 합니다.
error.CODE_REQUIRED={0}은(는) 필수이며 다음 중 하나여야 합니다: {1} (그룹 {2}).
error.CODE_INVALID={0} = {1}은(는) {2}의 활성 코드가 아닙니다. 다음 중 하나를 쓰세요: {3}.
error.ID_PREFIX_MISMATCH=결함 ID {0}은(는) {1}(으)로 시작해야 합니다.
error.TRANSITION_INVALID={0}에서 {1}(으)로의 전이는 허용되지 않습니다.
error.FIX_REQUIRED={0}에는 기록된 수정 커밋이 필요합니다.
error.FIX_ALREADY_RECORDED=이미 기록된 수정입니다. 갱신하려면 CI 정보를 함께 주세요.
error.EVIDENCE_REQUIRED={0}(으)로 옮기려면 evidence_uri가 필요합니다.
error.MERGE_TARGET_INVALID=MERGED에는 살아 있는 병합 대상이 필요합니다.
error.MERGED_DEFECT={0}은(는) {1}에 병합되었습니다. 사례는 {1}에 기록하세요.
error.SAME_SESSION=검증하는 세션은 수정을 기록했거나 완료를 보고한 세션과 달라야 합니다.
error.PROJECT_MOVE_FORBIDDEN=결함은 다른 프로젝트로 옮길 수 없습니다(ID에 프로젝트 코드가 들어 있습니다).
error.NOTHING_CHANGES=바뀌는 것이 없습니다.
error.VERSION_CONFLICT={0} {1}의 판 충돌: 기대 {2}, 현재 {3}.
error.OPERATION_CONFLICT=작업 키 {0}은(는) 이미 다른 작업, 내용 또는 채널에 묶여 있습니다.
error.DUPLICATE_KEY={0}이(가) 이미 있습니다.
error.KEY_REPLACEMENT_NOT_CONFIRMED=작성자 {0}에게는 이미 등록된 공개 키 {1}(등록 시각 {2})가 있습니다. 바꾸려면 이 지문을 명시한 교체 확인이 필요합니다.
error.SESSION_KEY_REQUIRED=작성자 {0}에게 유효한 세션 키가 없어 이 작성자의 쓰기를 받아들일 수 없습니다. 먼저 키를 등록하십시오. 아무것도 부여하지 않았습니다.
error.NOT_FOUND={0} {1}을(를) 찾을 수 없습니다.
error.AGENT_TOKEN_FORBIDDEN=에이전트 토큰은 관리 화면에서 쓸 수 없습니다.
error.UNAUTHORIZED=인증이 필요합니다.
error.DNS_REBINDING_BLOCKED=허용되지 않은 Host 헤더입니다.
error.TOO_MANY_AUTH_FAILURES=실패가 너무 많습니다. 잠시 뒤에 다시 시도하세요.
error.COMMON_CODE_DELETE_FORBIDDEN=공통코드는 삭제하거나 이름을 바꿀 수 없습니다. 상태를 INACTIVE로 바꾸세요.
error.PAYLOAD_TOO_LARGE=요청 본문이 너무 큽니다.
error.CSRF_REJECTED=CSRF 토큰이 없거나 올바르지 않습니다.
error.PASSKEY_APPROVAL_REQUIRED=이 변경에는 패스키 승인이 필요합니다. 패스키로 확인한 뒤 다시 보내십시오.
error.PASSKEY_APPROVAL_INVALID=패스키 승인이 이 변경에 유효하지 않습니다({0}). 새 승인을 받으십시오.
error.PASSKEY_NONE_REGISTERED=등록된 패스키가 없습니다. 서버에서 passkey-code 명령으로 일회용 등록 코드를 받은 뒤, 그 코드로 패스키를 등록하십시오.
error.PASSKEY_CODE_INVALID=등록 코드가 없거나, 알 수 없거나, 만료되었거나, 이미 사용되었습니다. passkey-code 명령으로 새 코드를 받으십시오.
error.PASSKEY_HOST_MISMATCH=이 패스키는 관리 웹의 이 주소용이 아닙니다({0}). 패스키를 등록한 호스트 이름으로 관리 웹을 여십시오.
error.PASSKEY_HTTPS_REQUIRED=패스키에는 HTTPS가 필요합니다(localhost만 평문 HTTP를 쓸 수 있습니다).
error.PASSKEY_ASSERTION_INVALID=패스키 서명(assertion)이 올바르지 않습니다({0}).
error.PASSKEY_LAST_KEY=마지막 패스키는 여기서 닫을 수 없습니다. 서버에서 passkey-code --remove-existing으로 패스키를 초기화하십시오.
error.DRIVER_NOT_CONFIGURED=등록된 JDBC 드라이버가 없습니다. driver-register 명령으로 등록하세요.
error.DRIVER_INVALID=JDBC 드라이버를 쓸 수 없습니다: {0}.
error.INTERNAL_ERROR=내부 오류가 발생했습니다.
error.INTEGRITY_VIOLATION=변경이 데이터 무결성 규칙을 어깁니다.
# 스키마 실패(이전, 검증, 권한 부여, 스키마 작업의 시간대).
error.SCHEMA_FILE_NAME_INVALID=스키마 파일 이름 {0}이(가) 올바르지 않습니다. V<번호>__<설명>.sql 형식이어야 합니다(소문자, 번호 앞에 0 없음).
error.SCHEMA_VERSION_DUPLICATE=버전 {0}의 스키마 파일이 둘 있습니다.
error.SCHEMA_VERSION_GAP=스키마 파일의 버전이 이어지지 않습니다. 버전 {0}이(가) 와야 하는데 V{1}이(가) 있습니다.
error.SCHEMA_FILES_UNREADABLE={0}의 스키마 파일을 읽을 수 없습니다.
error.SCHEMA_DATABASE_UNREACHABLE=스키마 작업을 위해 데이터베이스에 접속할 수 없습니다.
error.SCHEMA_HISTORY_MISSING=데이터베이스에 스키마 이력이 없습니다. ledger-cli migrate를 실행하세요.
error.SCHEMA_HISTORY_NOT_CREATED=스키마 이력 테이블을 만들 수 없습니다.
error.SCHEMA_APPLIED_FILE_MISSING=V{0}({1})은(는) 적용되었지만 스키마 파일이 없습니다.
error.SCHEMA_DIGEST_MISMATCH=V{0}({1})의 다이제스트가 다릅니다. 적용된 것은 {2}인데 파일은 {3}입니다.
error.SCHEMA_RECORDED_FAILED=V{0}({1})이(가) FAILED로 기록되어 있습니다. 데이터베이스를 복구한 뒤 ledger-cli migrate를 실행하세요.
error.SCHEMA_OUT_OF_ORDER=V{0}({1})은(는) 적용되지 않았는데 V{2}은(는) 적용되었습니다. 스키마 파일을 순서 밖으로 추가해서는 안 됩니다.
error.SCHEMA_PENDING=V{0}({1})이(가) 아직 적용되지 않았습니다. ledger-cli migrate를 실행하세요.
error.SCHEMA_MIGRATION_FAILED=이전 V{0}({1})이(가) 실패했습니다.
error.SCHEMA_ENCODING_NOT_UTF8=데이터베이스의 인코딩이 UTF-8이 아닙니다(데이터베이스가 알리는 값: {0}). 인코딩을 UTF-8로 하여 데이터베이스를 만드세요.
error.SCHEMA_GRANT_FAILED=계정에 권한을 부여할 수 없습니다(계정이 있어야 하고 접속이 권한을 부여할 수 있어야 합니다).
error.JVM_ZONE_NOT_UTC=JVM의 기본 시간대가 UTC가 아닙니다. JVM을 -Duser.timezone=UTC로 시작하세요.
error.SESSION_ZONE_NOT_UTC=데이터베이스 세션의 시간대가 UTC가 아닙니다(세션 시계가 UTC 시계와 {0}만큼 다릅니다).
error.SESSION_CLOCK_UNREADABLE=데이터베이스 세션의 시계를 읽을 수 없습니다.
# 데이터베이스 제품(행 제한처럼 제품마다 다른 SQL의 방언).
error.DATABASE_PRODUCT_UNREADABLE=연결에서 데이터베이스 제품을 읽을 수 없습니다.
error.DATABASE_PRODUCT_UNSUPPORTED=데이터베이스 제품 {0}은(는) 지원하지 않습니다. 원장은 PostgreSQL, Oracle, Db2, SQL Server, MariaDB, MySQL의 SQL을 갖고 있습니다.
error.DATABASE_PRODUCT_MISMATCH=설정된 JDBC URL은 데이터베이스 제품 {0}을(를) 가리키지만 연결은 {1}을(를) 알려 줍니다. ledger.jdbc.url과 드라이버를 같은 제품으로 맞추십시오.
# 첨부 (업로드 도구, 저장 파일, 점검).
error.ARTIFACT_UNSUPPORTED_PURPOSE=업로드 목적 {0}은(는) 지원하지 않습니다. 이 장부는 evidence만 지원합니다.
error.ARTIFACT_NOT_FOUND=업로드 또는 첨부 {0}을(를) 찾을 수 없습니다.
error.ARTIFACT_EXPIRED=업로드 {0}이(가) 만료되었습니다. begin부터 다시 하십시오.
error.ARTIFACT_CHUNK_CONFLICT=청크가 업로드에 맞지 않습니다. 순서가 어긋났거나 같은 번호의 다른 청크가 이미 받아졌습니다.
error.ARTIFACT_BUSY=다른 요청이 이 업로드에 덧붙이는 중입니다. 끝난 뒤 청크를 다시 보내십시오.
error.ARTIFACT_INCOMPLETE=업로드가 완전하지 않습니다. 기록되지 않은 청크가 있거나 바이트가 모자랍니다({0}). 빠진 청크를 다시 보낸 뒤 끝내십시오.
error.ARTIFACT_OPERATION_CONFLICT=작업 키 {0}은(는) 앞서 다른 파일 이름, 크기 또는 SHA-256에 쓰였습니다.
error.ARTIFACT_LIMIT=업로드가 거부되었습니다: {0}.
error.ARTIFACT_HASH_MISMATCH=받은 바이트의 크기 또는 SHA-256이 선언한 값과 다릅니다({0}). 바이트는 남아 있습니다.
error.CHUNK_HASH_MISMATCH=청크의 SHA-256이 함께 보낸 값과 다릅니다.
error.ARTIFACT_STORAGE_FULL=첨부 폴더의 디스크가 너무 찼습니다. 쓸 바이트 {0}, 쓸 수 있는 공간 {1}바이트, 남겨 두어야 할 공간 {2}바이트입니다. 소유자가 디스크를 비워야 합니다.
error.ARTIFACT_CORRUPTED=저장 파일이 태그, 끝 표시, 크기 또는 해시 검사를 통과하지 못합니다.
error.ARTIFACT_STORAGE_UNSAFE=첨부 저장소의 경로를 이 용도로 쓸 수 없습니다. 일반 파일이나 폴더가 있어야 할 자리가 그렇지 않거나, 소유자 전용으로 만들 수 없습니다(POSIX 권한도 ACL도 없는 파일 시스템, 또는 프로세스 계정을 알 수 없음): {0}.
error.ARTIFACT_KEY_MISSING=저장 파일에 필요한 쓸 수 있는 키 {0}이(가) 없습니다. 키 파일이 없거나, 비었거나, 길이가 키(256비트)와 다릅니다. 키 파일을 되살리십시오.
error.ARTIFACT_STORAGE_IO_ERROR=첨부 저장소를 읽거나 쓸 수 없습니다({0}).
error.MANAGEMENT_PORT_SEPARATE=관리 포트({0})가 서버 포트({1})와 다릅니다. 액추에이터가 루프백 전용 바인딩이 닿지 않는 포트에서 수신하게 됩니다. management.server.port를 지우고(상태 점검 /healthz는 서버 포트에 있습니다) 서비스를 다시 시작하세요.
