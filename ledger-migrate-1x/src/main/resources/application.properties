# The migration tool: no web server and no port; Boot internals stay quiet so only the command output is shown.
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false
# The texts of the tool are its own bundle; the texts of the command line, the secret store and the ledger database are the bundle
# messages of ledger-cli (on the class path through its jar), so a generic key is read from there and nowhere repeated.
spring.messages.basename=messages/migrate-1x,messages
# The default bundle (English) is the fallback of every locale without a bundle of its own; the locale of the machine is not a second fallback.
spring.messages.fallback-to-system-locale=false
# The installation of 2.0 the tool works for: ledger.secrets.home holds the settings, the driver registration, the driver jars and the
# secret directory; /etc/<instance> unless ledger.secrets.home is given (the Windows installation gives its own directory,
# see deploy/install.cmd). The 1.x installation used the same instance name by default; give --ledger.secrets.instance=<name> for another.
ledger.secrets.instance=pg-ledger-mcp
ledger.secrets.home=/etc/${ledger.secrets.instance}
ledger.secrets.directory=${ledger.secrets.home}/secrets
# The settings of the ledger database come from the same places as in the 2.0 applications, through spring.config.import: the
# settings file that render-deploy writes (application.yaml: the JDBC URL and the account of the application) and the
# operator's own (local.yaml), the registration of the JDBC driver (ledger.jdbc.driver.*, written by driver-register) and the
# secret store as two configuration trees of their own: common (ledger.jdbc.password) and tool (ledger.import.source.password, which only
# this tool reads); the folders of the services (admin, mcp) are not imported: nothing of this tool needs them. All are optional: a machine
# without a driver or without secrets still runs stop-1x and import-secrets-1x. The placeholders carry the defaults of the properties
# above, so the import does not depend on this file's own properties being visible to it; a value given on the command line
# (--ledger.secrets.home=...) always wins. The settings of the 1.x source (ledger.import.source.*) are in local.yaml and the secret store.
spring.config.import=optional:file:${ledger.secrets.home:/etc/${ledger.secrets.instance:pg-ledger-mcp}}/application.yaml,optional:file:${ledger.secrets.home:/etc/${ledger.secrets.instance:pg-ledger-mcp}}/local.yaml,optional:file:${ledger.secrets.home:/etc/${ledger.secrets.instance:pg-ledger-mcp}}/jdbc-driver.yaml,optional:configtree:${ledger.secrets.directory:${ledger.secrets.home:/etc/${ledger.secrets.instance:pg-ledger-mcp}}/secrets}/common/,optional:configtree:${ledger.secrets.directory:${ledger.secrets.home:/etc/${ledger.secrets.instance:pg-ledger-mcp}}/secrets}/tool/
