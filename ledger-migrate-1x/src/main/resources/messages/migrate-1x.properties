# The texts of the migration tool that are its own (English; migrate-1x_ko.properties holds the Korean ones with the same keys and
# placeholders). The texts of the command line, the secret store and the ledger database are the ones of ledger-cli (its bundle
# messages is the second base name of the message source): nothing of them is repeated here.
usage.header.migrate-1x=Usage: java -jar ledger-migrate-1x.jar <command> [arguments] [--ledger.secrets.directory=<path>]

# ---- stop-1x
usage.stop-1x=stop-1x [--name=<instance>] [--platform=linux] [--unit-dir=<dir>] [--env=<file> [--mcp-host=<host>] [--admin-host=<host>]]   Stop and disable the two services of the 1.x installation, <name> (the MCP server) and <name>-admin (the admin web, absent in 1.0.0), and keep the definition of each next to it as a backup: the unit file <unit-dir>/<service>.service (default /etc/systemd/system) is moved to <service>.service.1x-backup. 1.x had Linux (systemd) installations only, so there is nothing to stop on Windows. Java has no API for the service manager, so the command runs systemctl with fixed arguments. It touches only a service called <name> or <name>-admin whose definition is the one of 1.x (the default name is pg-ledger-mcp). With --env=<file> (the 1.x environment file) it first tells the public host names that the file allows and that the one --mcp-host and the one --admin-host (one host name each, lower case, no port: the form the installer of 2.0 takes) do not carry; the Host check of 2.0 does not accept them, and the run goes on. Run it first; a second run reports what was done before
stop-1x.stopped=The 1.x service {0} was stopped and disabled; its definition is kept as {1}.
stop-1x.done=The 1.x service {0} was stopped before; its definition is kept as {1}.
stop-1x.absent=The 1.x service {0} is not installed.
stop-1x.rollback=To return to the 1.x installation: stop the services of 2.0, copy each backup file listed above to its own name (without .1x-backup) in place of the unit of 2.0, so that the backup stays, run systemctl daemon-reload and then systemctl enable --now {0} (and the same for the admin service). The 1.x database was not touched.
stop-1x.hosts-not-accepted=The 1.x environment file allows the public host names {0}, which 2.0 does not accept: the installer takes one host name for each service (--{1}). The clients that still use these names are refused (HTTP 403) after the migration. The run goes on.
error.NOT_1X_SERVICE=The service defined by {0} is not the 1.x ledger (a unit of 1.x has an EnvironmentFile= line naming /etc/<name>/env), so it was not touched. Check --name and --unit-dir. Nothing was stopped or changed.
error.NO_1X_SERVICE=No 1.x service was found under {0} ({1}). Check --name and --unit-dir. Nothing was changed.
error.NO_1X_SERVICE_WINDOWS=1.x had Linux (systemd) installations only, so there is no 1.x service to stop on Windows; a service of that name there is one of 2.0 or of the system and is never touched. Nothing was changed.
error.BACKUP_DIFFERS=The backup {1} exists and holds other bytes than {0}, and a backup is never replaced. Compare the two files, move the backup away and run the command again. Nothing was stopped or changed.
error.SERVICE_COMMAND_FAILED=The command "{0}" of the service manager failed ({1}). What was stopped and kept before it stays so; run the command again to continue.
error.STOP_WRITE_FAILED=The definition of the service could not be kept as a backup ({0}: {1}). The service was stopped already; correct this and run the command again.

# ---- import-secrets-1x
usage.import-secrets-1x=import-secrets-1x (--env=<file> | --stdin) [--replace]   Move the secrets of a 1.x installation into the secret store of the 2.0 installation, so that the clients and the admin sign-in keep working: DBHUB_AUTH_TOKEN becomes ledger.mcp.token and ledger.admin.agent-token, PGLEDGER_ADMIN_TOKEN becomes ledger.admin.token. The 1.x environment file (KEY=VALUE lines) is read with --env=<file>, or from standard input with --stdin (the file of 1.x is owned by root and the secret store by the service account, so root opens the file and pipes it in to this command, which runs as the service account). Exactly one of the two is given. The installer of 2.0 has generated its own tokens already: without --replace a secret that exists is kept, with --replace it is replaced by the 1.x value (restart the services of 2.0 afterwards). Values are never printed, only the names of the secrets
import-secrets-1x.stored=Stored the secret {0} from the 1.x setting {1}.
import-secrets-1x.replaced=Replaced the secret {0} with the value of the 1.x setting {1}.
import-secrets-1x.kept=The secret {0} already exists and was kept (--replace replaces it).
import-secrets-1x.no-admin=The 1.x environment has no {0} (a 1.0.0 installation had no admin web), so {1} was not imported: the one of the installer of 2.0 stays.
error.ENV_FILE_FAILED=The 1.x environment file could not be read ({0}). Nothing was stored.
error.ENV_KEYS_MISSING=The 1.x environment has no value for {0}. Nothing was stored.
error.SECRETS_PARTIAL=The secret(s) {0} were stored from the 1.x environment, but {1} could not be written (the cause is in the log), so the tokens of 2.0 are not one set now. Do not restart the services of 2.0: correct the cause and run import-secrets-1x --replace again with the same input; it writes all of them again.
error.INVALID_1X_VALUE=The 1.x setting {0} cannot be used as a secret (it is shorter than 16 characters, or the admin token equals the agent token). Nothing was stored.

# ---- import-1x
usage.import-1x=import-1x [--verify-only] [--owner-account=<account>] [--stdin]   Copy the 1.x ledger (the old schema ledger, read only; connection ledger.import.source.url and ledger.import.source.username, optional ledger.import.source.schema; the 1.x credential is stored with secret-set of ledger-cli, see the README) into the new schema in one transaction, then compare the row count and the SHA-256 digest of every table; --verify-only repeats only the comparison. It refuses when the new schema already holds ledger data. The request receipts of 1.x are not copied. The grants are copied without a session key: register the key of each session with key-register of ledger-cli. The import writes the whole ledger, which neither application account may do: --owner-account runs it as the owner account, whose password is typed with hidden input and is not stored (--stdin takes it from the first line of standard input instead and needs --owner-account)
import-1x.table={0}: {1} rows, sha256 {2}
import-1x.imported=Imported {0} rows of {1} tables from the 1.x schema {2} in one transaction. Every table matches the 1.x table (rows and sha256). The grants have no session key yet: register the key of each session with key-register, then its grants work.
import-1x.verified=Verified {0} rows of {1} tables against the 1.x schema {2}. Every table matches the 1.x table (rows and sha256). Nothing was changed.
import-1x.violation={0}: {1}
import-1x.direction=Check {0} relations of a kind that has a direction (a is caused by b, a blocks b): 1.x stored every relation with its smaller id first and kept nowhere which defect the caller named first, so each is imported as stored and may be the wrong way round. Where it is, unlink it and link it again with the right defect first (the ledger_link tool or the admin console).
import-1x.direction.relation=relation {0}
import-1x.mismatch=Table {0}: {1} 1.x rows but {2} rows in the new schema; sha256 {3} against {4}
error.IMPORT_SOURCE_NOT_CONFIGURED=The 1.x ledger is not configured. Set ledger.import.source.url and ledger.import.source.username (ledger.import.source.schema is ledger unless the 1.x schema has another name) and store the password with secret-set ledger.import.source.password. Nothing was changed.
error.IMPORT_TARGET_NOT_EMPTY=The new schema already holds ledger data or an earlier import ({0}). The import runs once, on a schema that only migrate and setup have prepared. Nothing was changed.
error.IMPORT_SOURCE_INCOMPLETE=The 1.x ledger is not complete: the installer steps {0} are missing. It is older than the checkout 9fb62fe or it is not the 1.x schema; bring it up to date with the old installer first. Nothing was written.
error.IMPORT_DATA_REFUSED={0} value(s) of the 1.x ledger cannot be imported as they are (listed above, one per line: table[key].column and the reason). The import never invents a value: correct those rows in the 1.x ledger and run the command again. Nothing was written.
error.IMPORT_VERIFY_FAILED=The 1.x ledger and the new schema differ in the table {0}: {1} 1.x rows (sha256 {3}) against {2} rows in the new schema (sha256 {4}). The import was rolled back and nothing was written; a verification changes nothing.

# ---- retire-1x
usage.retire-1x=retire-1x [--confirm=<sha256> --backup-tested]   Remove what the 1.x installer made in the database after the move to 2.0 was accepted: the triggers, views, tables, functions, sequences, the schema and the database roles of the 1.x ledger (connection ledger.import.source.url and ledger.import.source.username, an account that owns the objects; ledger.import.source.schema and ledger.import.source.roles name the schema and the roles). Without options it checks that import-1x --verify-only matches and that the 1.x service is stopped, prints every object in the order it is dropped and the SHA-256 of that list, and changes nothing. --confirm=<sha256> drops exactly that list in one transaction and is refused when the list has changed. --backup-tested is required with it: it states that a pg_dump backup of the 1.x database was made and its restore was tested (the command cannot check that). A role that is the running account, an account of the 2.0 settings, has other members or owns objects elsewhere stays and is listed as SKIPPED
retire-1x.object={0}
retire-1x.listed=The 1.x schema {0} holds {1} objects to remove (listed above, in the order they are dropped; a role that stays is listed as SKIPPED). SHA-256 of the list: {2}. Nothing was changed. Keep the 1.x database as the rollback source until 2.0 is accepted, make a pg_dump backup and test its restore, then run: retire-1x --confirm={2} --backup-tested
retire-1x.removed=Removed {0} objects of the 1.x schema {1} in one transaction. The functions, triggers, views, tables and the schema of 1.x are gone from the database; a role that was kept is listed above as SKIPPED.
error.RETIRE_BACKUP_NOT_ACKNOWLEDGED=--confirm needs --backup-tested: it states that a pg_dump backup of the 1.x database was made and its restore was tested. The command cannot check the backup. Nothing was changed.
error.RETIRE_VERIFY_FAILED=The 1.x ledger and the new schema differ in the table {0}: {1} 1.x rows (sha256 {3}) against {2} rows in the new schema (sha256 {4}). What the 1.x database holds has not been moved completely, so nothing was removed. Repeat import-1x --verify-only, correct the difference and run the command again.
error.RETIRE_OWN_SCHEMA=The 1.x schema {0} holds the tables of the 2.0 ledger itself (schema_history). Dropping it would drop the ledger. Check ledger.import.source.schema (the 1.x schema is ledger unless it has another name; the schema of 2.0 is ledger.schema.name). Nothing was removed.
error.RETIRE_SESSIONS_CONNECTED={1} other session(s) use the 1.x database as a 1.x role or hold a lock in the 1.x schema: {0}. Stop the 1.x service (stop-1x) and close those sessions, then run the command again. Nothing was removed.
error.RETIRE_NOT_OWNER=The account of ledger.import.source.username does not own {1} object(s) of the 1.x schema: {0}. Run the command with an account that owns them (the owner role of the old installer, or a role that has its rights); the read-only login that was made for the import cannot drop them. Nothing was removed.
error.RETIRE_SOURCE_CHANGED=The 1.x database is not as it was when the list was printed: the list now has the SHA-256 {0}. Nothing was removed. Run the command without options, read the new list and confirm that one.
