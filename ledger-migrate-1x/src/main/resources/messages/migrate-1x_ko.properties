# 이전 도구 고유의 문구(한국어. 영어 문구는 migrate-1x.properties에 같은 키와 같은 자리표시자로 있음). 명령줄, 비밀 저장소,
# 원장 데이터베이스의 문구는 ledger-cli의 것을 쓰며(그 묶음 messages가 메시지 소스의 두 번째 기본 이름), 여기에 되풀이하지 않음.
usage.header.migrate-1x=사용법: java -jar ledger-migrate-1x.jar <명령> [인자] [--ledger.secrets.directory=<경로>]

# ---- stop-1x
usage.stop-1x=stop-1x [--name=<인스턴스>] [--platform=linux] [--unit-dir=<디렉터리>] [--env=<파일> [--mcp-host=<호스트>[,<호스트>...]] [--admin-host=<호스트>[,<호스트>...]]]   1.x 설치의 서비스 둘, 곧 <이름>(MCP 서버)과 <이름>-admin(관리 웹, 1.0.0에는 없음)을 멈추고 비활성화하며, 각 정의를 그 옆에 백업으로 보관합니다. 유닛 파일 <unit-dir>/<서비스>.service(기본 /etc/systemd/system)를 <서비스>.service.1x-backup으로 옮깁니다. 1.x에는 Linux(systemd) 설치만 있었으므로 Windows에서 멈출 것은 없습니다. Java에는 서비스 관리자용 API가 없으므로 이 명령은 고정된 인자로 systemctl을 실행합니다. 이름이 <이름> 또는 <이름>-admin이고 정의가 1.x의 것인 서비스만 건드립니다(기본 이름은 pg-ledger-mcp). --env=<파일>(1.x 환경 파일)을 주면 먼저, 그 파일이 허용하는 공개 호스트 이름을 2.0 설치 프로그램에 줄 --mcp-host와 --admin-host가 담고 있지 않을 때 거절합니다. 가장 먼저 실행하며, 다시 실행하면 앞서 한 일을 알려 줍니다
stop-1x.stopped=1.x 서비스 {0}을(를) 멈추고 비활성화했습니다. 정의는 {1}(으)로 보관했습니다.
stop-1x.done=1.x 서비스 {0}은(는) 앞서 이미 멈췄습니다. 정의는 {1}(으)로 보관되어 있습니다.
stop-1x.absent=1.x 서비스 {0}은(는) 설치되어 있지 않습니다.
stop-1x.rollback=1.x 설치로 되돌리려면 2.0 서비스를 멈추고, 위에 적은 백업 파일을 각각 2.0 유닛 자리에 원래 이름(.1x-backup 없이)으로 복사하고(백업이 남도록 복사합니다) systemctl daemon-reload를 실행하고 systemctl enable --now {0}을(를) 실행하십시오(관리 서비스도 같습니다). 1.x 데이터베이스는 건드리지 않았습니다.
error.HOSTS_DROPPED=1.x 환경 파일이 공개 호스트 이름 {0}을(를) 허용하는데 준 옵션이 담고 있지 않습니다. 이대로 이전하면 1.x 서버의 클라이언트가 HTTP 403으로 거부됩니다. --{1}에 추가하세요(이름 하나 또는 쉼표로 구분한 목록, 예: --{1}=<호스트>,<호스트>. 같은 옵션을 2.0 설치 프로그램에도 주십시오). 클라이언트가 더 쓰지 않는 이름이면 파일의 사본에서 지우고 그 사본을 --env로 주세요. 멈추거나 쓴 것은 없습니다.
error.NOT_1X_SERVICE={0}이(가) 정의하는 서비스는 1.x 원장이 아니어서 건드리지 않았습니다(1.x의 유닛에는 /etc/<이름>/env를 가리키는 EnvironmentFile= 줄이 있습니다). --name과 --unit-dir을 확인하십시오. 멈추거나 바꾼 것은 없습니다.
error.NO_1X_SERVICE={0} 아래에서 1.x 서비스를 찾지 못했습니다({1}). --name과 --unit-dir을 확인하십시오. 바뀐 것은 없습니다.
error.NO_1X_SERVICE_WINDOWS=1.x에는 Linux(systemd) 설치만 있었으므로 Windows에는 멈출 1.x 서비스가 없습니다. 그곳의 같은 이름 서비스는 2.0 또는 시스템의 것이며 절대 건드리지 않습니다. 바뀐 것은 없습니다.
error.BACKUP_DIFFERS=백업 {1}이(가) 있는데 {0}과(와) 내용이 다르며, 백업은 절대 덮어쓰지 않습니다. 두 파일을 비교하고 백업을 다른 곳으로 옮긴 뒤 명령을 다시 실행하십시오. 멈추거나 바꾼 것은 없습니다.
error.SERVICE_COMMAND_FAILED=서비스 관리자의 명령 "{0}"이(가) 실패했습니다({1}). 그 앞에서 멈추고 보관한 것은 그대로이며, 명령을 다시 실행하면 이어서 합니다.
error.STOP_WRITE_FAILED=서비스의 정의를 백업으로 보관하지 못했습니다({0}: {1}). 서비스는 이미 멈췄습니다. 원인을 바로잡고 명령을 다시 실행하십시오.

# ---- import-secrets-1x
usage.import-secrets-1x=import-secrets-1x (--env=<파일> | --stdin) [--replace]   1.x 설치의 비밀을 2.0 설치의 비밀 저장소로 옮겨 클라이언트와 관리자 로그인이 그대로 동작하게 합니다. DBHUB_AUTH_TOKEN은 ledger.mcp.token과 ledger.admin.agent-token이 되고 PGLEDGER_ADMIN_TOKEN은 ledger.admin.token이 됩니다. 1.x 환경 파일(KEY=VALUE 줄)은 --env=<파일>로 읽거나 --stdin으로 표준 입력에서 읽습니다(1.x의 파일은 root 소유이고 비밀 저장소는 서비스 계정 소유이므로, root가 파일을 열어 서비스 계정으로 실행하는 이 명령에 파이프로 넘깁니다). 둘 중 정확히 하나를 지정합니다. 2.0 설치 프로그램이 자기 토큰을 이미 만들었으므로, --replace 없이는 이미 있는 비밀을 그대로 두고 --replace를 주면 1.x의 값으로 바꿉니다(그 뒤 2.0 서비스를 다시 시작하십시오). 값은 출력하지 않고 비밀의 이름만 출력합니다
import-secrets-1x.stored=비밀 {0}을(를) 1.x 설정 {1}에서 가져와 저장했습니다.
import-secrets-1x.replaced=비밀 {0}을(를) 1.x 설정 {1}의 값으로 바꿨습니다.
import-secrets-1x.kept=비밀 {0}이(가) 이미 있어 그대로 두었습니다(--replace를 주면 바꿉니다).
import-secrets-1x.no-admin=1.x 환경에 {0}이(가) 없어(1.0.0 설치에는 관리 웹이 없었습니다) {1}은(는) 가져오지 않았습니다. 2.0 설치 프로그램이 만든 것이 그대로 남습니다.
error.ENV_FILE_FAILED=1.x 환경 파일을 읽지 못했습니다({0}). 아무것도 저장하지 않았습니다.
error.ENV_KEYS_MISSING=1.x 환경에 {0}의 값이 없습니다. 아무것도 저장하지 않았습니다.
error.INVALID_1X_VALUE=1.x 설정 {0}은(는) 비밀로 쓸 수 없습니다(16자보다 짧거나, 관리자 토큰이 에이전트 토큰과 같습니다). 아무것도 저장하지 않았습니다.

# ---- import-1x
usage.import-1x=import-1x [--verify-only] [--owner-account=<계정>] [--stdin]   1.x 원장(옛 스키마 ledger, 읽기 전용. 접속 ledger.import.source.url·ledger.import.source.username, 선택 ledger.import.source.schema. 1.x의 인증 값은 ledger-cli의 secret-set으로 저장하며 README 참조)을 하나의 트랜잭션으로 새 스키마에 옮긴 뒤 모든 표의 행 수와 SHA-256 요약값을 대조합니다. --verify-only는 대조만 다시 합니다. 새 스키마에 이미 원장 데이터가 있으면 거절합니다. 1.x의 요청 영수증은 옮기지 않습니다. 부여는 세션 키 없이 옮겨지므로 세션마다 ledger-cli의 key-register로 키를 등록해야 합니다. 가져오기는 원장 전체를 쓰는데 두 응용 계정은 그럴 수 없으므로, --owner-account로 소유자 계정으로 실행하며 그 비밀번호는 숨김 입력으로 받고 저장하지 않습니다(--stdin은 숨김 입력 대신 표준 입력의 첫 줄에서 받으며 --owner-account가 필요합니다)
import-1x.table={0}: {1}행, sha256 {2}
import-1x.imported=1.x 스키마 {2}의 표 {1}개, {0}행을 하나의 트랜잭션으로 가져왔습니다. 모든 표가 1.x 표와 일치합니다(행 수와 sha256). 부여에는 아직 세션 키가 없습니다. 세션마다 key-register로 키를 등록하면 그 부여가 작동합니다.
import-1x.verified=1.x 스키마 {2}의 표 {1}개, {0}행을 확인했습니다. 모든 표가 1.x 표와 일치합니다(행 수와 sha256). 바뀐 것은 없습니다.
import-1x.violation={0}: {1}
import-1x.direction=방향이 있는 종류(a의 원인은 b, a가 b를 차단)의 관계 {0}건을 확인하십시오. 1.x는 모든 관계를 작은 id가 앞에 오도록 저장했고 호출자가 어느 결함을 먼저 적었는지 어디에도 남기지 않았으므로, 각 관계는 저장된 그대로 가져왔고 방향이 거꾸로일 수 있습니다. 거꾸로인 관계는 연결을 해제한 뒤 올바른 결함을 앞에 두고 다시 연결하십시오(ledger_link 도구 또는 관리 콘솔).
import-1x.direction.relation=관계 {0}
import-1x.mismatch=표 {0}: 1.x 표는 {1}행이지만 새 스키마는 {2}행입니다. sha256 {3}, {4}
error.IMPORT_SOURCE_NOT_CONFIGURED=1.x 원장이 설정되어 있지 않습니다. ledger.import.source.url과 ledger.import.source.username을 설정하고(1.x 스키마 이름이 ledger가 아니면 ledger.import.source.schema도), 비밀번호는 secret-set ledger.import.source.password로 저장하십시오. 바뀐 것은 없습니다.
error.IMPORT_TARGET_NOT_EMPTY=새 스키마에 이미 원장 데이터나 이전 가져오기의 기록이 있습니다({0}). 가져오기는 migrate와 setup만 마친 스키마에 한 번만 실행합니다. 바뀐 것은 없습니다.
error.IMPORT_SOURCE_INCOMPLETE=1.x 원장이 완전하지 않습니다. 설치기 단계 {0}이(가) 없습니다. 체크아웃 9fb62fe보다 오래되었거나 1.x 스키마가 아닙니다. 먼저 옛 설치기로 최신으로 맞추십시오. 쓴 것은 없습니다.
error.IMPORT_DATA_REFUSED=1.x 원장의 값 {0}개를 그대로 가져올 수 없습니다(위에 한 줄씩 표[키].열과 이유를 적었습니다). 가져오기는 값을 지어내지 않습니다. 1.x 원장에서 그 행을 고친 뒤 명령을 다시 실행하십시오. 쓴 것은 없습니다.
error.IMPORT_VERIFY_FAILED=1.x 원장과 새 스키마가 표 {0}에서 다릅니다. 1.x 표 {1}행(sha256 {3}), 새 스키마 {2}행(sha256 {4}). 가져오기는 되돌려졌고 쓴 것은 없습니다. 확인만 한 경우에도 바뀐 것은 없습니다.

# ---- retire-1x
usage.retire-1x=retire-1x [--confirm=<sha256> --backup-tested]   2.0으로의 이전을 받아들인 뒤, 1.x 설치기가 데이터베이스에 만든 것, 곧 1.x 원장의 트리거·뷰·표·함수·시퀀스·스키마와 데이터베이스 역할을 제거합니다(접속 ledger.import.source.url·ledger.import.source.username, 이 계정이 객체의 소유자여야 합니다. 스키마와 역할은 ledger.import.source.schema·ledger.import.source.roles). 옵션 없이 실행하면 import-1x --verify-only가 일치하고 1.x 서비스가 멈춰 있는지 확인한 뒤, 모든 객체를 제거 순서대로 보여 주고 그 목록의 SHA-256을 출력하며 아무것도 바꾸지 않습니다. --confirm=<sha256>은 바로 그 목록을 하나의 트랜잭션으로 제거하며, 목록이 바뀌었으면 거절합니다. 여기에는 --backup-tested가 필요합니다. 1.x 데이터베이스를 pg_dump로 백업하고 복원 시험을 마쳤다는 확인이며, 명령은 이를 확인할 수 없습니다. 실행 중인 계정, 2.0 설정의 계정, 다른 구성원이 있거나 다른 곳의 객체를 소유한 역할은 남기고 SKIPPED로 표시합니다
retire-1x.object={0}
retire-1x.listed=1.x 스키마 {0}에서 제거할 객체는 {1}개입니다(위에 제거 순서대로 나열했으며, 남는 역할은 SKIPPED로 표시합니다). 목록의 SHA-256: {2}. 바뀐 것은 없습니다. 2.0을 받아들일 때까지 1.x 데이터베이스를 되돌릴 원본으로 보관하십시오. pg_dump로 백업하고 복원 시험을 마친 뒤 실행하십시오: retire-1x --confirm={2} --backup-tested
retire-1x.removed=1.x 스키마 {1}의 객체 {0}개를 하나의 트랜잭션으로 제거했습니다. 1.x의 함수·트리거·뷰·표·스키마는 데이터베이스에서 사라졌고, 남긴 역할은 위에 SKIPPED로 표시되어 있습니다.
error.RETIRE_BACKUP_NOT_ACKNOWLEDGED=--confirm에는 --backup-tested가 필요합니다. 1.x 데이터베이스를 pg_dump로 백업하고 복원 시험을 마쳤다는 확인입니다. 명령은 백업을 확인할 수 없습니다. 바뀐 것은 없습니다.
error.RETIRE_VERIFY_FAILED=1.x 원장과 새 스키마가 표 {0}에서 다릅니다. 1.x 표 {1}행(sha256 {3}), 새 스키마 {2}행(sha256 {4}). 1.x 데이터베이스의 내용이 아직 모두 옮겨지지 않았으므로 아무것도 제거하지 않았습니다. import-1x --verify-only를 다시 실행해 차이를 바로잡은 뒤 명령을 다시 실행하십시오.
error.RETIRE_OWN_SCHEMA=1.x 스키마 {0}에 2.0 원장 자체의 표(schema_history)가 있습니다. 이 스키마를 제거하면 원장이 사라집니다. ledger.import.source.schema를 확인하십시오(1.x 스키마는 이름이 다르지 않으면 ledger이며, 2.0의 스키마는 ledger.schema.name입니다). 제거한 것은 없습니다.
error.RETIRE_SESSIONS_CONNECTED=다른 세션 {1}개가 1.x 역할로 1.x 데이터베이스를 쓰고 있거나 1.x 스키마에 잠금을 잡고 있습니다. {0}. 1.x 서비스를 멈추고(stop-1x) 그 세션을 닫은 뒤 명령을 다시 실행하십시오. 제거한 것은 없습니다.
error.RETIRE_NOT_OWNER=ledger.import.source.username의 계정이 1.x 스키마의 객체 {1}개를 소유하고 있지 않습니다. {0}. 그 객체를 소유한 계정(옛 설치기의 소유자 역할 또는 그 권한을 가진 역할)으로 실행하십시오. 가져오기용으로 만든 읽기 전용 로그인은 제거할 수 없습니다. 제거한 것은 없습니다.
error.RETIRE_SOURCE_CHANGED=1.x 데이터베이스가 목록을 출력했을 때와 다릅니다. 지금 목록의 SHA-256은 {0}입니다. 제거한 것은 없습니다. 옵션 없이 명령을 실행해 새 목록을 읽고 그 목록을 확인하십시오.
