# Speed of the build (docs/testing/TEST_CASES.md section 30). Limits of the resources of a machine (workers, test JVMs, heap,
# processors) are not set here: they are command arguments (see the README, Build and test).
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
