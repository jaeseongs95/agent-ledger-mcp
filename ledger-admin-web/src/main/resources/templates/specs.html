<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments :: head(#{specs.title})}"></head>
<body>
<th:block th:replace="~{fragments :: header('specs')}"></th:block>
<main id="main">
  <div class="page-header">
    <div class="page-header-text">
      <h1 th:text="#{specs.title}">Specifications</h1>
    </div>
  </div>

  <div th:if="${choice.selected() == null}" class="empty-state">
    <p class="empty-state-title" th:text="#{common.noProject}">Add a project first.</p>
    <a class="button secondary btn-sm" th:href="@{/projects}" th:text="#{nav.projects}">Projects</a>
  </div>

  <th:block th:if="${choice.selected() != null}">
    <form method="get" th:action="@{/specs}" class="filters">
      <div class="filter-field">
        <label for="project" th:text="#{common.project}">Project</label>
        <select id="project" name="project">
          <option th:each="p : ${choice.projects()}" th:value="${p.id()}" th:text="${p.id()}" th:selected="${p.id() == choice.selected()}">p1</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="status" th:text="#{common.status}">Status</label>
        <select id="status" name="status">
          <option value="" th:text="#{common.any}">Any</option>
          <option th:each="s : ${statuses}" th:value="${s.token()}" th:text="${s.token()}" th:selected="${s.token() == filter.status()}">DRAFT</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="attention" th:text="#{common.attention}">Attention</label>
        <select id="attention" name="attention">
          <option value="" th:text="#{common.any}">Any</option>
          <option th:each="a : ${attentions}" th:value="${a}" th:text="#{'attention.' + ${a}}" th:selected="${#strings.toString(a) == filter.attention()}">kind</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="priority" th:text="#{specs.priority}">Priority</label>
        <input id="priority" name="priority" type="text" th:value="${filter.priority()}" maxlength="32">
      </div>
      <div class="filter-field">
        <label for="owner" th:text="#{common.owner}">Owner</label>
        <input id="owner" name="owner" type="text" th:value="${filter.owner()}" maxlength="200">
      </div>
      <div class="filter-field filter-field-sm">
        <label for="limit" th:text="#{paging.size}">Rows per page</label>
        <select id="limit" name="limit">
          <option th:each="n : ${sizes}" th:value="${n}" th:text="${n}" th:selected="${n == paging.limit()}">50</option>
        </select>
      </div>
      <div class="filter-actions">
        <button type="submit" th:text="#{common.apply}">Apply</button>
        <a th:if="${hasFilters}" th:href="${resetHref}" class="button secondary" th:text="#{common.resetFilters}">Reset filters</a>
      </div>
    </form>

    <div th:if="${!#lists.isEmpty(page.items())}" class="table-wrap">
      <table>
        <caption class="sr-only" th:text="#{specs.title}">Specifications</caption>
        <thead>
          <tr>
            <th scope="col" th:text="#{col.id}">ID</th>
            <th scope="col" th:text="#{common.status}">Status</th>
            <th scope="col" th:text="#{specs.priority}">Priority</th>
            <th scope="col" th:text="#{col.title}">Title</th>
            <th scope="col" th:text="#{common.owner}">Owner</th>
            <th scope="col" th:text="#{col.updated}">Updated</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="s : ${page.items()}">
            <td class="code"><a th:href="@{/specs/detail(id=${s.id()})}" th:text="${s.id()}">ID</a></td>
            <td><span th:class="'badge badge-' + ${s.status()}" th:text="${s.status()}">DRAFT</span></td>
            <td>
              <span th:if="${s.priority() != null}" th:class="'badge badge-' + ${s.priority()}" th:text="${s.priority()}">P1</span>
              <span th:if="${s.priority() == null}" class="muted" th:text="#{common.noneValue}">—</span>
            </td>
            <td th:text="${s.title()}">Title</td>
            <td th:text="${s.ownerActorId() != null} ? ${s.ownerActorId()} : #{common.noneValue}">owner</td>
            <td class="num"><time th:replace="~{fragments :: time(${s.updatedAt()})}">t</time></td>
          </tr>
        </tbody>
      </table>
    </div>
    <th:block th:if="${#lists.isEmpty(page.items())}" th:replace="~{fragments :: emptyState(${hasFilters}, ${resetHref})}"></th:block>
    <nav th:replace="~{fragments :: pager(${paging}, ${total})}"></nav>
  </th:block>
</main>
<th:block th:replace="~{fragments :: footer}"></th:block>
</body>
</html>
