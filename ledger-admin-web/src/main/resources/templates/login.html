<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments :: head(#{login.title})}"></head>
<body>
<th:block th:replace="~{fragments :: header('login')}"></th:block>
<main id="main" class="narrow">
  <div class="auth-card">
    <div>
      <h1 th:text="#{login.title}">Sign in</h1>
      <p class="hint" th:text="#{app.name}">Ledger admin</p>
    </div>

    <p th:if="${errorKey != null}" class="alert alert-danger error" role="alert" th:text="#{${errorKey}}">Sign-in failed.</p>
    <p th:if="${loggedOut}" class="alert alert-success notice" role="status" th:text="#{login.loggedOut}">You are signed out.</p>
    <p th:if="${setupMode}" class="alert alert-warning notice" role="status" th:text="#{login.setup}">Register a JDBC driver with the command line tool first.</p>

    <form th:if="${tokenSignIn}" method="post" th:action="@{/login}" class="form-wide">
      <input type="hidden" name="username" value="owner">
      <div class="form-field">
        <label for="token" th:text="#{login.token}">Admin token</label>
        <input id="token" name="token" type="password" autocomplete="current-password" required autofocus>
      </div>
      <button type="submit" class="btn-full" th:text="#{login.submit}">Sign in</button>
    </form>

    <section th:if="${passkeySignIn}" class="passkey-signin" th:attr="aria-label=#{login.passkey}">
      <button type="button" id="passkey-signin" class="btn-full" th:text="#{login.passkey}">Sign in with a passkey</button>
    </section>

    <section th:if="${!#lists.isEmpty(providers)}" class="providers" th:attr="aria-label=#{login.providers}">
      <div class="auth-divider" th:text="#{login.providers}">Or sign in with</div>
      <ul class="provider-list">
        <li th:each="provider : ${providers}">
          <a class="button secondary" th:href="@{/oauth2/authorization/{id}(id=${provider.id()})}" th:text="#{login.oidc(${provider.name()})}">Provider</a>
        </li>
      </ul>
    </section>

    <details th:if="${enrollment}" class="disclosure enrollment" th:open="${errorKey != null}">
      <summary th:text="#{login.code.title}">Register a passkey</summary>
      <div class="disclosure-body">
        <p class="hint" th:text="#{login.code.help}">Ask for a one-time code on the server and type it here.</p>
        <form method="post" th:action="@{/login/ott}" class="form-wide">
          <div class="form-field">
            <label for="code" th:text="#{login.code}">One-time code</label>
            <input id="code" name="token" type="text" autocomplete="off" spellcheck="false" required>
          </div>
          <button type="submit" class="secondary btn-full" th:text="#{login.code.submit}">Continue</button>
        </form>
      </div>
    </details>
  </div>
</main>
<th:block th:replace="~{fragments :: footer}"></th:block>
</body>
</html>
