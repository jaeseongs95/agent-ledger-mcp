# Command line tool: no web server and no port; Boot internals stay quiet so only the command output is shown.
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false
spring.messages.basename=messages
# The default bundle (English) is the fallback of every locale without a bundle of its own; the locale of the machine is not a second fallback.
spring.messages.fallback-to-system-locale=false
# The installation the tool works for: ledger.secrets.home holds the settings, the driver registration, the driver jars and the
# secret directory; /etc/<instance> unless ledger.secrets.home is given (the Windows installation gives its own directory,
# see deploy/install.cmd). Both services and the owner commands share one instance.
ledger.secrets.instance=@instance-name@
ledger.secrets.home=/etc/${ledger.secrets.instance}
ledger.secrets.directory=${ledger.secrets.home}/secrets
# The settings of the ledger database come from the same places as in the server applications, through spring.config.import:
# the settings file that render-deploy writes (application.yaml: the JDBC URL and the account of the application) and the
# operator's own (local.yaml), the registration of the JDBC driver (ledger.jdbc.driver.*, written by driver-register) and the
# two folders of the secret store as configuration trees of their own: common (ledger.jdbc.password, which the database commands
# need) and mcp (ledger.mcp.token, which mcp-check presents); ledger.jdbc.url and ledger.jdbc.username are ordinary settings.
# The folder admin is not imported: no command of this tool needs an admin secret, so they are not in its Environment (the
# folder of each secret is SecretFolder; the secret directory itself is never a tree: Spring Boot would name every property
# after its folder). All are optional: a machine without a driver or without secrets still runs secret-set and driver-register.
# The placeholders carry the defaults of the properties above, so the import does not depend on this file's own properties
# being visible to it; a value given on the command line (--ledger.secrets.home=...) always wins. A service imports the same
# sources plus the settings file of its own (mcp.yaml, admin.yaml) and the folders it needs: common and its own.
spring.config.import=optional:file:${ledger.secrets.home:/etc/${ledger.secrets.instance:@instance-name@}}/application.yaml,optional:file:${ledger.secrets.home:/etc/${ledger.secrets.instance:@instance-name@}}/local.yaml,optional:file:${ledger.secrets.home:/etc/${ledger.secrets.instance:@instance-name@}}/jdbc-driver.yaml,optional:configtree:${ledger.secrets.directory:${ledger.secrets.home:/etc/${ledger.secrets.instance:@instance-name@}}/secrets}/common/,optional:configtree:${ledger.secrets.directory:${ledger.secrets.home:/etc/${ledger.secrets.instance:@instance-name@}}/secrets}/mcp/
# driver-register: the registration file (read back through spring.config.import above) and the one directory a driver jar
# is taken from; both follow ledger.secrets.home and can be overridden on the command line.
ledger.cli.driver.file=${ledger.secrets.home}/jdbc-driver.yaml
ledger.cli.driver.directory=${ledger.secrets.home}/drivers
